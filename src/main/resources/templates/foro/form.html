<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Publicación | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/colaborador-consultas.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(${rolVista})}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content">
            <div th:replace="~{fragments/layout :: avisoPermisos}"></div>
            <section class="page-intro">
                <div><h2 th:text="${titulo}"></h2><p>Comparte una pregunta, una decisión o una solución con el equipo.</p></div>
            </section>
            <div class="forum-compose-grid">
                <section class="card compose-card">
                    <div class="compose-body">
                        <form th:action="@{/foros/guardar}" th:object="${foroForm}" method="post" novalidate>
                            <input type="hidden" th:field="*{idForo}">
                            <p class="field-error" role="alert" th:errors="*{idForo}"></p>
                            <div class="form-grid">
                                <div class="form-group full">
                                    <label for="titulo">Título de la publicación</label>
                                    <input type="text" th:field="*{titulo}" th:errorclass="is-invalid"
                                           placeholder="Ej. Pruebas de integración" aria-describedby="ayuda-titulo">
                                    <p class="help" id="ayuda-titulo">Hasta 180 caracteres.</p>
                                    <p class="field-error" role="alert" th:errors="*{titulo}"></p>
                                </div>
                                <div class="form-group">
                                    <label for="idProyecto">Proyecto relacionado</label>
                                    <select th:field="*{idProyecto}" th:errorclass="is-invalid" th:if="${proyectoPublicacion == null}">
                                        <option value="">Tema general</option>
                                        <option th:each="p : ${proyectos}" th:value="${p.idProyecto}" th:text="${p.nombre}"></option>
                                    </select>
                                    <th:block th:if="${proyectoPublicacion != null}">
                                        <input id="idProyecto" type="text" th:value="${proyectoPublicacion}" readonly>
                                        <input type="hidden" name="idProyecto" th:value="${foroForm.idProyecto}">
                                    </th:block>
                                    <p class="field-error" role="alert" th:errors="*{idProyecto}"></p>
                                </div>
                                <div class="form-group">
                                    <label for="categoria">Categoría</label>
                                    <select th:field="*{categoria}" th:errorclass="is-invalid">
                                        <option value="">Selecciona una categoría</option>
                                        <option th:each="cat : ${categoriasForo}" th:value="${cat}" th:text="${cat}"></option>
                                    </select>
                                    <p class="field-error" role="alert" th:errors="*{categoria}"></p>
                                </div>
                                <div class="form-group full" th:unless="${etiquetasDisponibles.isEmpty()}">
                                    <span id="etiquetas-foro">Etiquetas (opcional)</span>
                                    <div class="filtro-etiquetas" role="group" aria-labelledby="etiquetas-foro">
                                        <label th:each="etiqueta : ${etiquetasDisponibles}">
                                            <input type="checkbox" th:field="*{etiquetas}" th:value="${etiqueta.idEtiqueta}">
                                            <span th:text="${etiqueta.nombre}"></span>
                                        </label>
                                    </div>
                                    <p class="field-error" role="alert" th:errors="*{etiquetas}"></p>
                                </div>
                                <div class="form-group full">
                                    <label for="contenido">Contexto y detalle</label>
                                    <textarea rows="8" th:field="*{contenido}" th:errorclass="is-invalid"
                                              placeholder="Describe qué ocurrió y qué probaste." aria-describedby="ayuda-detalle"></textarea>
                                    <p class="help" id="ayuda-detalle">Hasta 5000 caracteres.</p>
                                    <p class="field-error" role="alert" th:errors="*{contenido}"></p>
                                </div>
                            </div>
                            <div class="form-actions">
                                <a class="btn btn-light" th:if="${rolVista == 'PM'}" th:href="@{/pm/foros}">Cancelar</a>
                                <a class="btn btn-light" th:unless="${rolVista == 'PM'}" th:href="@{/colaborador/foros}">Cancelar</a>
                                <button class="btn btn-primary" type="submit"
                                        th:text="${proyectoPublicacion == null ? 'Publicar en el foro' : 'Guardar cambios'}"></button>
                            </div>
                        </form>
                    </div>
                </section>
                <aside class="card">
                    <h3 class="mt-0">Guía de publicación</h3>
                    <p>Indica el problema o la decisión en el título. Agrega una categoría y etiquetas para que tu equipo pueda encontrar el tema.</p>
                </aside>
            </div>
        </div>
    </main>
</div>
</body>
</html>
