<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat por proyecto | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell">
<aside th:replace="~{fragments/layout :: sidebar(${rolSesion})}"></aside>
<main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
<div class="content">
<section class="page-intro"><div><h2>Conversaciones de proyectos</h2>
<p>Selecciona un proyecto autorizado para escribir a sus participantes.</p></div></section>
<section class="card section"><div class="card-title"><h2>Mis proyectos disponibles</h2></div>
<p class="muted" th:if="${#lists.isEmpty(proyectos)}">No tienes proyectos asociados a tu rol.</p>
<a th:each="p : ${proyectos}" class="sb-project-link" th:href="@{/mensajes/proyecto/{id}(id=${p.idProyecto})}">
<strong th:text="${p.nombre}">Nombre</strong><span class="muted">Abrir conversación →</span></a>
</section></div></main></div></body></html>
