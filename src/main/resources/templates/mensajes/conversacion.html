<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversación | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar(${rolSesion})}"></aside>
<main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
<div class="content">
<section class="page-intro"><div><h2 th:text="${proyecto.nombre}">Proyecto</h2>
<p>Mensajes entre usuarios autorizados de este proyecto. Para ver nuevos mensajes, actualiza la página.</p></div>
<a class="btn btn-light" th:href="@{/mensajes}">Volver a proyectos</a></section>
<section class="card"><div class="card-title"><h2>Conversación</h2>
<a class="btn btn-light btn-sm" th:href="@{/mensajes/proyecto/{id}(id=${proyecto.idProyecto})}">Actualizar</a></div>
<p th:if="${exito}" class="badge badge-success" th:text="${exito}"></p>
<p th:if="${error}" class="badge" role="alert" th:text="${error}"></p>
<div class="sb-chat-log" role="log" aria-label="Mensajes del proyecto">
<p class="muted" th:if="${#lists.isEmpty(mensajes)}">Todavía no hay mensajes en este proyecto.</p>
<article class="sb-message" th:each="m : ${mensajes}" th:classappend="${m.usuario.idUsuario == usuarioActual.idUsuario} ? ' sb-message--mine' : ''">
<div class="sb-message__meta"><strong th:text="${m.usuario.nombreCompleto}">Autor</strong>
<time th:text="${m.fechaEnvio != null ? #temporals.format(m.fechaEnvio,'dd/MM/yyyy HH:mm') : 'Ahora'}">Fecha</time></div>
<div class="sb-message__body" th:text="${m.contenido}">Texto</div></article></div>
<form class="sb-form" method="post" th:action="@{/mensajes/proyecto/{id}(id=${proyecto.idProyecto})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-group"><label for="contenido">Escribir mensaje (hasta 500 caracteres)</label>
<textarea name="contenido" id="contenido" maxlength="500" required placeholder="Escribe un mensaje para el equipo…"></textarea></div>
<div class="actions" style="justify-content:flex-end"><button class="btn btn-primary" type="submit">Enviar mensaje</button></div>
</form></section></div></main></div></body></html>
