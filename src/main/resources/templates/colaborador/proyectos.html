<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis proyectos | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="page-intro"><div><h2>Participación en proyectos</h2><p>Visualiza los proyectos en los que participas, tu rol, dedicación y progreso general.</p></div></section><div class="grid-3"><article class="card" th:each="a : ${asignaciones}"><div class="card-title"><div><span class="badge badge-purple" th:text="${a.proyecto.estado}"></span><h3 th:text="${a.proyecto.nombre}"></h3></div><span class="badge badge-success" th:text="|${a.porcentajeDedicacion}% carga|"></span></div><p class="muted" th:text="${a.proyecto.descripcion}"></p><div class="profile-info-grid"><div class="info-box"><small>Mi rol</small><strong th:text="${a.rolProyecto}"></strong></div><div class="info-box"><small>Periodo</small><strong th:text="|${a.fechaInicio} → ${a.fechaFin}|"></strong></div></div><p class="muted" style="margin-bottom:6px">Progreso del proyecto</p><div class="progress"><span th:style="|width:${a.proyecto.progreso}%|"></span></div><small class="muted" th:text="|${a.proyecto.progreso}% completado|"></small></article></div><div class="empty" th:if="${#lists.isEmpty(asignaciones)}">Aún no participas en proyectos.</div></div></main></div></body></html>
