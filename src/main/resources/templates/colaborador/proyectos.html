<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis proyectos | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><section class="page-intro flex flex-col gap-4 border-b border-gray-100 pb-5 md:flex-row md:items-end md:justify-between"><div><h2>Participación en proyectos</h2><p>Visualiza los proyectos en los que participas, tu rol, dedicación y progreso general.</p></div></section><div class="grid-3 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3"><article class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm" th:each="a : ${asignaciones}"><div class="card-title mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><div><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-purple bg-brand-50 text-brand-700" th:text="${a.proyecto.estado}"></span><h3 th:text="${a.proyecto.nombre}"></h3></div><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-success bg-success-50 text-success-700" th:text="|${a.porcentajeDedicacion}% carga|"></span></div><p class="muted" th:text="${a.proyecto.descripcion}"></p><div class="profile-info-grid"><div class="info-box rounded-xl border border-gray-100 bg-gray-50 p-4"><small>Mi rol</small><strong th:text="${a.rolProyecto}"></strong></div><div class="info-box rounded-xl border border-gray-100 bg-gray-50 p-4"><small>Periodo</small><strong th:text="|${a.fechaInicio} → ${a.fechaFin}|"></strong></div></div><p class="muted" style="margin-bottom:6px">Progreso del proyecto</p><div class="progress"><span th:style="|width:${a.proyecto.progreso}%|"></span></div><small class="muted" th:text="|${a.proyecto.progreso}% completado|"></small></article></div><div class="empty rounded-xl border border-dashed border-gray-300 bg-gray-50 px-5 py-8 text-center text-sm text-gray-500" th:if="${#lists.isEmpty(asignaciones)}">Aún no participas en proyectos.</div></div></main></div></body></html>
