<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]" th:if="${colaborador != null}">
<div class="alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
<section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm hero-card"><div class="profile-hero"><div class="profile-avatar" th:text="${#strings.substring(colaborador.usuario.nombres,0,1)}"></div><div><h2 class="mt-0" th:text="${colaborador.usuario.nombreCompleto}"></h2><p class="muted" th:text="|${colaborador.cargo} · ${colaborador.area}|"></p><div class="tags"><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700" th:text="${colaborador.seniority.name() == 'JUNIOR' ? 'Junior' : (colaborador.seniority.name() == 'SEMI_SENIOR' ? 'Semi senior' : (colaborador.seniority.name() == 'SENIOR' ? 'Senior' : 'Líder'))}"></span><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700" th:text="|Disponibilidad ${colaborador.disponibilidadBase}%|"></span><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700" th:text="|${#lists.size(habilidades)} habilidades|"></span></div></div><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-primary bg-brand-600 text-white hover:bg-brand-700 focus:ring-brand-100" th:href="@{/colaborador/perfil/editar}">Editar perfil</a></div></section>
<div class="grid-2 grid grid-cols-1 gap-5 lg:grid-cols-2 section"><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><h3>Sobre mí</h3><p class="muted" th:text="${colaborador.biografia ?: 'Aún no se ha registrado una biografía.'}"></p><h3>Intereses profesionales</h3><p class="muted" th:text="${colaborador.interesesProfesionales ?: 'Sin intereses registrados.'}"></p><h3>Habilidades principales</h3><div class="tags"><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700" th:each="h : ${habilidades}" th:text="|${h.nombre} · ${h.nivel == 'BASICO' ? 'Básico' : (h.nivel == 'INTERMEDIO' ? 'Intermedio' : (h.nivel == 'AVANZADO' ? 'Avanzado' : 'Experto'))}|"></span></div></section><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><h3>Información profesional</h3><div class="profile-info-grid"><div class="info-box rounded-xl border border-gray-100 bg-gray-50 p-4"><small>Cargo</small><strong th:text="${colaborador.cargo}"></strong></div><div class="info-box rounded-xl border border-gray-100 bg-gray-50 p-4"><small>Área</small><strong th:text="${colaborador.area}"></strong></div><div class="info-box rounded-xl border border-gray-100 bg-gray-50 p-4"><small>Correo</small><strong th:text="${colaborador.usuario.correo}"></strong></div><div class="info-box rounded-xl border border-gray-100 bg-gray-50 p-4"><small>Teléfono</small><strong th:text="${colaborador.usuario.telefono ?: '-'}"></strong></div><div class="info-box rounded-xl border border-gray-100 bg-gray-50 p-4"><small>Nivel profesional</small><strong th:text="${colaborador.seniority.name() == 'JUNIOR' ? 'Junior' : (colaborador.seniority.name() == 'SEMI_SENIOR' ? 'Semi senior' : (colaborador.seniority.name() == 'SENIOR' ? 'Senior' : 'Líder'))}"></strong></div><div class="info-box rounded-xl border border-gray-100 bg-gray-50 p-4"><small>Disponibilidad</small><strong th:text="|${colaborador.disponibilidadBase}%|"></strong></div></div></section></div>
<section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm section"><div class="card-title mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><h2>Certificaciones</h2><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light btn-sm border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100" th:href="@{/colaborador/certificaciones}">Ver todas</a></div><div class="table-wrap overflow-x-auto rounded-xl border border-gray-200"><table class="w-full min-w-[720px] border-collapse text-left text-sm"><thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wide text-gray-500"><tr><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Certificación</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Entidad</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Emisión</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Expiración</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Estado</th></tr></thead><tbody class="divide-y divide-gray-100 bg-white"><tr th:each="c : ${certificaciones}"><td class="px-4 py-3 align-middle text-sm text-gray-700"><strong th:text="${c.nombre}"></strong></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${c.entidadEmisora}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${c.fechaEmision != null ? #temporals.format(c.fechaEmision,'dd-MM-yyyy') : '-'}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${c.fechaExpiracion != null ? #temporals.format(c.fechaExpiracion,'dd-MM-yyyy') : '-'}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-success bg-success-50 text-success-700" th:text="${c.estado.name() == 'SIN_EXPIRACION' ? 'Sin expiración' : (c.estado.name() == 'VIGENTE' ? 'Vigente' : 'Vencida')}"></span></td></tr></tbody></table></div><div class="empty rounded-xl border border-dashed border-gray-300 bg-gray-50 px-5 py-8 text-center text-sm text-gray-500" th:if="${#lists.isEmpty(certificaciones)}">No hay certificaciones registradas.</div></section>
</div></main></div></body></html>
