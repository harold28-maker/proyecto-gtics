<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content" th:if="${colaborador != null}">
<div class="alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
<section class="card hero-card"><div class="profile-hero"><div class="profile-avatar" th:text="${#strings.substring(colaborador.usuario.nombres,0,1)}"></div><div><h2 class="mt-0" th:text="${colaborador.usuario.nombreCompleto}"></h2><p class="muted" th:text="|${colaborador.cargo} · ${colaborador.area}|"></p><div class="tags"><span class="tag" th:text="${colaborador.seniority.name() == 'JUNIOR' ? 'Junior' : (colaborador.seniority.name() == 'SEMI_SENIOR' ? 'Semi senior' : (colaborador.seniority.name() == 'SENIOR' ? 'Senior' : 'Líder'))}"></span><span class="tag" th:text="|Disponibilidad ${colaborador.disponibilidadBase}%|"></span><span class="tag" th:text="|${#lists.size(habilidades)} habilidades|"></span></div></div><a class="btn btn-primary" th:href="@{/colaborador/perfil/editar}">Editar perfil</a></div></section>
<div class="grid-2 section"><section class="card"><h3>Sobre mí</h3><p class="muted" th:text="${colaborador.biografia ?: 'Aún no se ha registrado una biografía.'}"></p><h3>Intereses profesionales</h3><p class="muted" th:text="${colaborador.interesesProfesionales ?: 'Sin intereses registrados.'}"></p><h3>Habilidades principales</h3><div class="tags"><span class="tag" th:each="h : ${habilidades}" th:text="|${h.nombre} · ${h.nivel == 'BASICO' ? 'Básico' : (h.nivel == 'INTERMEDIO' ? 'Intermedio' : (h.nivel == 'AVANZADO' ? 'Avanzado' : 'Experto'))}|"></span></div></section><section class="card"><h3>Información profesional</h3><div class="profile-info-grid"><div class="info-box"><small>Cargo</small><strong th:text="${colaborador.cargo}"></strong></div><div class="info-box"><small>Área</small><strong th:text="${colaborador.area}"></strong></div><div class="info-box"><small>Correo</small><strong th:text="${colaborador.usuario.correo}"></strong></div><div class="info-box"><small>Teléfono</small><strong th:text="${colaborador.usuario.telefono ?: '-'}"></strong></div><div class="info-box"><small>Nivel profesional</small><strong th:text="${colaborador.seniority.name() == 'JUNIOR' ? 'Junior' : (colaborador.seniority.name() == 'SEMI_SENIOR' ? 'Semi senior' : (colaborador.seniority.name() == 'SENIOR' ? 'Senior' : 'Líder'))}"></strong></div><div class="info-box"><small>Disponibilidad</small><strong th:text="|${colaborador.disponibilidadBase}%|"></strong></div></div></section></div>
<section class="card section"><div class="card-title"><h2>Certificaciones</h2><a class="btn btn-light btn-sm" th:href="@{/colaborador/certificaciones}">Ver todas</a></div><div class="table-wrap"><table><thead><tr><th>Certificación</th><th>Entidad</th><th>Emisión</th><th>Expiración</th><th>Estado</th></tr></thead><tbody><tr th:each="c : ${certificaciones}"><td><strong th:text="${c.nombre}"></strong></td><td th:text="${c.entidadEmisora}"></td><td th:text="${c.fechaEmision != null ? #temporals.format(c.fechaEmision,'dd-MM-yyyy') : '-'}"></td><td th:text="${c.fechaExpiracion != null ? #temporals.format(c.fechaExpiracion,'dd-MM-yyyy') : '-'}"></td><td><span class="badge badge-success" th:text="${c.estado == null ? '-' : (c.estado.name() == 'SIN_EXPIRACION' ? 'Sin expiración' : (c.estado.name() == 'VIGENTE' ? 'Vigente' : 'Vencida'))}"></span></td></tr></tbody></table></div><div class="empty" th:if="${#lists.isEmpty(certificaciones)}">No hay certificaciones registradas.</div></section>
</div></main></div></body></html>
