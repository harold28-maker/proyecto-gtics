<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mis asignaciones | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/colaborador-consultas.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content vista-colaborador">
            <div th:replace="~{fragments/layout :: avisoPermisos}"></div>
            <p class="alert-success" role="status" th:if="${mensajeExito}" th:text="${mensajeExito}"></p>
            <p class="alert-error" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></p>
            <section class="page-intro vista-portada">
                <div><h2>Mis asignaciones</h2><p>Cada fila muestra tu rol, el período y la dedicación de una asignación.</p></div>
            </section>
            <section class="panel-consulta" aria-label="Buscar en mis asignaciones">
                <form class="filtros-consulta" method="get" th:action="@{/colaborador/asignaciones}" novalidate>
                    <div class="form-group filtro-texto">
                        <label for="buscar-asignacion">Buscar por proyecto o rol</label>
                        <input id="buscar-asignacion" name="q" type="search" th:value="${q}" placeholder="Ej. Plataforma Web"
                               th:attr="aria-invalid=${errorBusqueda != null},aria-describedby=${errorBusqueda != null ? 'error-busqueda' : null}">
                    </div>
                    <div class="form-group">
                        <label for="estado-asignacion">Estado</label>
                        <select id="estado-asignacion" name="estado"
                                th:attr="aria-invalid=${errorEstado != null},aria-describedby=${errorEstado != null ? 'error-estado' : null}">
                            <option value="TODOS">Todos los estados</option>
                            <option th:each="estado : ${estados}" th:value="${estado.name()}"
                                    th:text="${estado.etiqueta}" th:selected="${estado == estadoSeleccionado}"></option>
                        </select>
                    </div>
                    <div class="barra-acciones">
                        <button class="btn btn-primary" type="submit">Buscar</button>
                        <a class="btn btn-light" th:href="@{/colaborador/asignaciones}">Limpiar</a>
                    </div>
                </form>
                <p class="alert-error" role="alert" id="error-busqueda" th:if="${errorBusqueda}" th:text="${errorBusqueda}"></p>
                <p class="alert-error" role="alert" id="error-estado" th:if="${errorEstado}" th:text="${errorEstado}"></p>
            </section>
            <section class="card panel-consulta" aria-label="Asignaciones registradas"
                     th:unless="${errorBusqueda != null or errorEstado != null}">
                <p class="empty" th:if="${filas.isEmpty()}">No hay asignaciones para mostrar.</p>

                    <div class="table-wrap" th:unless="${filas.isEmpty()}">
                        <table class="tabla-participaciones">
                            <thead>
                            <tr>
                                <th scope="col">Proyecto</th>
                                <th scope="col">Rol en el proyecto</th>
                                <th scope="col">Inicio</th>
                                <th scope="col">Fin</th>
                                <th scope="col">Mi dedicación</th>
                                <th scope="col">Estado de la asignación</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="fila : ${filas}" th:with="a=${fila.asignacion}">
                                <td><strong th:text="${a.proyecto.nombre}"></strong></td>
                                <td th:text="${a.rolProyecto ?: 'Sin rol registrado'}"></td>
                                <td class="sin-corte" th:text="${a.fechaInicio != null ? #temporals.format(a.fechaInicio, 'dd-MM-yyyy') : 'Sin fecha'}"></td>
                                <td class="sin-corte" th:text="${a.fechaFin != null ? #temporals.format(a.fechaFin, 'dd-MM-yyyy') : 'Sin fecha de fin'}"></td>
                                <td class="sin-corte" th:text="|${a.porcentajeDedicacion} %|"></td>
                                <td><span class="badge" th:classappend="${fila.estado.estilo}" th:text="${fila.estado.etiqueta}"></span></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
