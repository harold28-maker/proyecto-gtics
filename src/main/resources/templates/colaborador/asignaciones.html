<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis asignaciones | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm assignment-card"><form class="filters flex flex-col gap-3 rounded-xl bg-gray-50 p-3 sm:flex-row sm:flex-wrap sm:items-center assignment-filters" method="get" th:action="@{/colaborador/asignaciones}"><input class="search w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" name="q" th:value="${q}" placeholder="Buscar por proyecto o rol"><select class="compact w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" name="estado"><option value="TODOS">Todos los estados</option><option value="ACTIVA" th:selected="${estadoSeleccionado == 'ACTIVA'}">Activa</option><option value="PLANIFICADA" th:selected="${estadoSeleccionado == 'PLANIFICADA'}">Planificada</option><option value="FINALIZADA" th:selected="${estadoSeleccionado == 'FINALIZADA'}">Finalizada</option><option value="CANCELADA" th:selected="${estadoSeleccionado == 'CANCELADA'}">Cancelada</option></select><button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100">Aplicar filtros</button></form><div class="table-wrap overflow-x-auto rounded-xl border border-gray-200"><table class="w-full min-w-[720px] border-collapse text-left text-sm"><thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wide text-gray-500"><tr><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Proyecto</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Rol / posición</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Prioridad</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Estado</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Fecha de inicio</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Carga</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Progreso del proyecto</th></tr></thead><tbody class="divide-y divide-gray-100 bg-white"><tr th:each="a : ${asignaciones}"><td class="px-4 py-3 align-middle text-sm text-gray-700"><strong th:text="${a.proyecto.nombre}"></strong><br><small class="muted" th:text="${a.proyecto.descripcion}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${a.rolProyecto}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-purple bg-brand-50 text-brand-700" th:text="${a.proyecto.prioridad.name() == 'ALTA' ? 'Alta' : (a.proyecto.prioridad.name() == 'MEDIA' ? 'Media' : 'Baja')}"></span></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold" th:classappend="${a.estado.name() == 'ACTIVA'} ? ' badge-success' : ' badge-warning'" th:text="${a.estado.name() == 'ACTIVA' ? 'Activa' : (a.estado.name() == 'PLANIFICADA' ? 'Planificada' : (a.estado.name() == 'FINALIZADA' ? 'Finalizada' : 'Cancelada'))}"></span></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${a.fechaInicio != null ? #temporals.format(a.fechaInicio,'dd-MM-yyyy') : '-'}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="progress"><span th:style="|width:${a.porcentajeDedicacion}%|"></span></div><small th:text="|${a.porcentajeDedicacion}%|"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="progress green"><span th:style="|width:${a.proyecto.progreso}%|"></span></div><small th:text="|${a.proyecto.progreso}%|"></small></td></tr></tbody></table></div><div class="empty rounded-xl border border-dashed border-gray-300 bg-gray-50 px-5 py-8 text-center text-sm text-gray-500" th:if="${#lists.isEmpty(asignaciones)}">No tienes asignaciones con esos filtros.</div></section></div></main></div></body></html>
