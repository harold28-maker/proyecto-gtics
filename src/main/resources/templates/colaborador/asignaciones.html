<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis asignaciones | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="card assignment-card"><form class="filters assignment-filters" method="get" th:action="@{/colaborador/asignaciones}"><input class="search" name="q" th:value="${q}" placeholder="Buscar por proyecto o rol"><select class="compact" name="estado"><option value="TODOS">Todos los estados</option><option value="ACTIVA" th:selected="${estadoSeleccionado == 'ACTIVA'}">Activa</option><option value="PLANIFICADA" th:selected="${estadoSeleccionado == 'PLANIFICADA'}">Planificada</option><option value="FINALIZADA" th:selected="${estadoSeleccionado == 'FINALIZADA'}">Finalizada</option><option value="CANCELADA" th:selected="${estadoSeleccionado == 'CANCELADA'}">Cancelada</option></select><button class="btn btn-light">Aplicar filtros</button></form><div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Rol / posición</th><th>Prioridad</th><th>Estado</th><th>Fecha de inicio</th><th>Carga</th><th>Progreso del proyecto</th></tr></thead><tbody><tr th:each="a : ${asignaciones}"><td><strong th:text="${a.proyecto.nombre}"></strong><br><small class="muted" th:text="${a.proyecto.descripcion}"></small></td><td th:text="${a.rolProyecto}"></td><td><span class="badge badge-purple" th:text="${a.proyecto.prioridad.name() == 'ALTA' ? 'Alta' : (a.proyecto.prioridad.name() == 'MEDIA' ? 'Media' : 'Baja')}"></span></td><td><span class="badge" th:classappend="${a.estado.name() == 'ACTIVA'} ? ' badge-success' : ' badge-warning'" th:text="${a.estado.name() == 'ACTIVA' ? 'Activa' : (a.estado.name() == 'PLANIFICADA' ? 'Planificada' : (a.estado.name() == 'FINALIZADA' ? 'Finalizada' : 'Cancelada'))}"></span></td><td th:text="${a.fechaInicio != null ? #temporals.format(a.fechaInicio,'dd-MM-yyyy') : '-'}"></td><td><div class="progress"><span th:style="|width:${a.porcentajeDedicacion}%|"></span></div><small th:text="|${a.porcentajeDedicacion}%|"></small></td><td><div class="progress green"><span th:style="|width:${a.proyecto.progreso}%|"></span></div><small th:text="|${a.proyecto.progreso}%|"></small></td></tr></tbody></table></div><div class="empty" th:if="${#lists.isEmpty(asignaciones)}">No tienes asignaciones con esos filtros.</div></section></div></main></div></body></html>
