<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chat | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/colaborador-consultas.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content vista-colaborador">
            <div th:replace="~{fragments/layout :: avisoPermisos}"></div>
            <p class="alert-success" role="status" th:if="${mensajeExito}" th:text="${mensajeExito}"></p>
            <p class="alert-error" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></p>
            <section class="page-intro vista-portada">
                <div><h2>Chat</h2><p>Conversa con tu equipo.</p></div>
            </section>
            <section class="card panel-consulta chat-colaborador" aria-label="Conversaciones">
                <nav class="chat-conversaciones" aria-label="Conversaciones">
                    <h3>Conversaciones</h3>
                    <p class="muted" th:if="${proyectosChat.isEmpty()}">Aún no tienes conversaciones de proyectos.</p>
                    <a class="chat-proyecto-link" th:each="acceso : ${proyectosChat}" th:with="p=${acceso.proyecto}"
                       th:href="@{/colaborador/chat(idProyecto=${p.idProyecto})}" th:text="${p.nombre}"
                       th:attr="aria-current=${conversacion != null and p.idProyecto == conversacion.proyecto.idProyecto ? 'page' : null}"></a>
                </nav>

                <p class="empty" th:if="${conversacion == null}">Selecciona un proyecto para abrir su conversación.</p>
                <div class="conversacion-chat" th:if="${conversacion != null}" th:with="proyecto=${conversacion.proyecto}">
                    <header class="conversacion-cabecera">
                        <h3 th:text="${proyecto.nombre}"></h3>
                        <span class="badge" th:classappend="${conversacion.puedeParticipar ? 'badge-success' : 'badge-purple'}"
                              th:text="${conversacion.puedeParticipar ? (proyecto.estado.name() == 'ACTIVE' ? 'En curso' : 'Chat disponible') : 'Solo lectura'}"></span>
                    </header>
                    <div class="chat-mensajes" role="region" aria-label="Historial de mensajes" tabindex="0">
                        <p class="empty" th:if="${diasChat.isEmpty()}">Todavía no hay mensajes en este proyecto.</p>
                        <th:block th:each="dia : ${diasChat}">
                            <p class="dia-chat" th:text="${dia.fecha != null ? #temporals.format(dia.fecha, 'dd-MM-yyyy') : 'Fecha sin registrar'}"></p>
                            <article class="mensaje-chat" th:each="m : ${dia.mensajes}"
                                     th:with="propio=${m.usuario.idUsuario == idUsuarioChat}"
                                     th:classappend="${propio ? 'propio' : ''}">
                                <div class="mensaje-meta">
                                    <strong th:text="${propio ? 'Tú' : m.usuario.nombreCompleto}"></strong>
                                    <time th:if="${m.fechaEnvio != null}" th:attr="datetime=${m.fechaEnvio}"
                                          th:text="${#temporals.format(m.fechaEnvio, 'HH:mm')}"></time>
                                </div>
                                <p th:text="${m.contenido}"></p>
                            </article>
                        </th:block>
                    </div>
                    <p class="conversacion-solo-lectura muted" th:unless="${conversacion.puedeParticipar}">
                        Puedes escribir cuando tengas una asignación vigente en este proyecto.
                    </p>
                    <form class="compositor-consulta" th:if="${conversacion.puedeParticipar}"
                          th:action="@{/colaborador/chat/enviar}" method="post" novalidate>
                        <input type="hidden" name="idProyecto" th:value="${proyecto.idProyecto}">
                        <label for="mensaje-proyecto" th:text="|Mensaje para ${proyecto.nombre}|"></label>
                        <textarea id="mensaje-proyecto" name="contenido" rows="2" placeholder="Escribe un mensaje al equipo"
                                  th:text="${borrador}"
                                  th:attr="aria-invalid=${errorMensaje != null},aria-describedby=${errorMensaje != null ? 'limite-chat error-mensaje' : 'limite-chat'}"></textarea>
                        <p class="field-error" role="alert" id="error-mensaje" th:if="${errorMensaje}" th:text="${errorMensaje}"></p>
                        <div class="compositor-pie">
                            <small id="limite-chat">Hasta 500 caracteres.</small>
                            <button class="btn btn-primary" type="submit">Enviar</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
