<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="login-shell-simple">
    <th:block th:replace="~{fragments/acceso :: marca}"></th:block>

    <section class="login-access-side" aria-labelledby="login-title">
        <th:block th:replace="~{fragments/acceso :: volverInicio}"></th:block>

        <div class="login-box-simple">
            <header class="login-box-header">
                <h1 id="login-title">Iniciar sesión</h1>
                <p class="login-simple-description">Accede con tu cuenta institucional.</p>
            </header>

            <div class="login-alert-simple" role="alert"
                 th:if="${errorLogin != null}" th:text="${errorLogin}">
                Correo o contraseña incorrectos.
            </div>
            <div class="login-alert-simple login-alert-success" role="status" th:if="${logoutExitoso}">
                Sesión cerrada correctamente.
            </div>
            <div class="login-alert-simple login-alert-success" role="status" th:if="${contrasenaActualizada}">
                Contraseña actualizada correctamente.
            </div>

            <form th:if="${sesionActiva}" id="cerrar-sesion-login" th:action="@{/logout}" method="post">
                <button class="btn btn-primary login-button-simple" type="submit">
                    Continuar al inicio de sesión
                </button>
            </form>

            <form th:unless="${sesionActiva}" id="login-form" th:action="@{/acceder}"
                  method="post" autocomplete="off" novalidate>
                <div class="login-field-simple">
                    <label for="correo">Correo institucional</label>
                    <input id="correo" name="correo" type="email" aria-required="true"
                           autocomplete="username" placeholder="nombre@skillbridge.com"
                           th:value="${correoIngresado}"
                           th:attr="aria-invalid=${errorCorreo != null}, aria-describedby=${errorCorreo != null ? 'error-correo' : null}">
                    <p id="error-correo" class="field-error" role="alert"
                       th:if="${errorCorreo}" th:text="${errorCorreo}"></p>
                </div>

                <div class="login-field-simple">
                    <label for="password">Contraseña</label>
                    <div class="login-password-simple">
                        <input id="password" name="password" type="password"
                               aria-required="true" autocomplete="off"
                               th:attr="aria-invalid=${errorContrasena != null}, aria-describedby=${errorContrasena != null ? 'error-contrasena' : null}">
                        <button id="loginMostrarClave" type="button" aria-controls="password"
                                aria-label="Mostrar contraseña" hidden>Mostrar</button>
                    </div>
                    <p id="error-contrasena" class="field-error" role="alert"
                       th:if="${errorContrasena}" th:text="${errorContrasena}"></p>
                    <a class="login-link-simple" th:href="@{/recuperar-contrasena}">¿Olvidaste tu contraseña?</a>
                </div>

                <button class="btn btn-primary login-button-simple" type="submit">Ingresar</button>
            </form>

            <p class="login-security-note">El acceso se asigna según tu rol.</p>
        </div>
    </section>
</main>

<script th:if="${sesionActiva}">
    document.getElementById('cerrar-sesion-login').requestSubmit();
</script>
<script th:unless="${sesionActiva}">
    const clave = document.getElementById('password');
    const mostrarClave = document.getElementById('loginMostrarClave');

    function cambiarVisibilidadClave(visible) {
        clave.type = visible ? 'text' : 'password';
        mostrarClave.textContent = visible ? 'Ocultar' : 'Mostrar';
        mostrarClave.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }

    mostrarClave.hidden = false;
    mostrarClave.addEventListener('click', function () {
        cambiarVisibilidadClave(clave.type === 'password');
    });

    // Seguridad: nunca conservar la contraseña al regresar a esta página.
    // El correo se restaura desde el servidor solamente si la contraseña falló.
    window.addEventListener('pageshow', function () {
        cambiarVisibilidadClave(false);
        clave.value = '';
    });
</script>
</body>
</html>
