<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Colaboradores | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/resource-gestion.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content directorio">
            <div th:replace="~{fragments/layout :: avisoPermisos}"></div>
            <section class="page-intro">
                <div>
                    <h2>Directorio de talento</h2>
                    <p th:text="${verCapacidad ? 'Busca colaboradores por habilidad, nivel profesional o disponibilidad.'
                                    : 'Busca colaboradores por habilidad o nivel profesional.'}"></p>
                </div>
            </section>
            <section class="card directorio-panel" aria-label="Directorio de colaboradores">
                <form class="directorio-filtros" method="get" th:action="@{/resource/colaboradores}" novalidate>
                    <div class="form-group buscar">
                        <label for="busqueda">Nombre, cargo o habilidad</label>
                        <input id="busqueda" name="q" type="search" th:value="${q}" placeholder="Ej. Java, María González o QA Engineer"
                               th:attr="aria-invalid=${erroresFiltros.containsKey('q')},aria-describedby=${erroresFiltros.containsKey('q') ? 'error-busqueda' : null}">
                        <p class="field-error" id="error-busqueda" role="alert" th:if="${erroresFiltros.containsKey('q')}" th:text="${erroresFiltros.get('q')}"></p>
                    </div>
                    <div class="form-group">
                        <label for="nivel">Nivel profesional</label>
                        <select id="nivel" name="nivel"
                                th:attr="aria-invalid=${erroresFiltros.containsKey('nivel')},aria-describedby=${erroresFiltros.containsKey('nivel') ? 'error-nivel' : null}">
                            <option value="TODOS">Todos los niveles</option>
                            <option th:each="n : ${niveles}" th:value="${n.name()}" th:selected="${n == nivelSeleccionado}" th:text="${n.etiqueta}"></option>
                        </select>
                        <p class="field-error" id="error-nivel" role="alert" th:if="${erroresFiltros.containsKey('nivel')}" th:text="${erroresFiltros.get('nivel')}"></p>
                    </div>
                    <div class="form-group" th:if="${verCapacidad}">
                        <label for="disponibilidad">Disponibilidad hoy</label>
                        <select id="disponibilidad" name="disponibilidad"
                                th:attr="aria-invalid=${erroresFiltros.containsKey('disponibilidad')},aria-describedby=${erroresFiltros.containsKey('disponibilidad') ? 'error-disponibilidad' : null}">
                            <option value="TODOS">Cualquiera</option>
                            <option value="DISPONIBLE" th:selected="${disponibilidadSeleccionada?.name() == 'DISPONIBLE'}">50 % o más</option>
                            <option value="PARCIAL" th:selected="${disponibilidadSeleccionada?.name() == 'PARCIAL'}">Entre 1 % y 49 %</option>
                            <option value="SIN_DISPONIBILIDAD" th:selected="${disponibilidadSeleccionada?.name() == 'SIN_DISPONIBILIDAD'}">Sin disponibilidad</option>
                        </select>
                        <p class="field-error" id="error-disponibilidad" role="alert" th:if="${erroresFiltros.containsKey('disponibilidad')}" th:text="${erroresFiltros.get('disponibilidad')}"></p>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado de cuenta</label>
                        <select id="estado" name="estado"
                                th:attr="aria-invalid=${erroresFiltros.containsKey('estado')},aria-describedby=${erroresFiltros.containsKey('estado') ? 'error-estado' : null}">
                            <option value="TODOS">Todos los estados</option>
                            <option th:each="e : ${estados}" th:value="${e.name()}" th:selected="${e == estadoSeleccionado}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(e.name()))}"></option>
                        </select>
                        <p class="field-error" id="error-estado" role="alert" th:if="${erroresFiltros.containsKey('estado')}" th:text="${erroresFiltros.get('estado')}"></p>
                    </div>
                    <div class="acciones">
                        <button class="btn btn-primary" type="submit">Buscar</button>
                        <a class="btn btn-light" th:href="@{/resource/colaboradores}">Limpiar</a>
                    </div>
                </form>

                <p class="field-error" role="alert" th:if="${erroresFiltros.containsKey('page')}" th:text="${erroresFiltros.get('page')}"></p>
                <p class="field-error" role="alert" th:if="${!verCapacidad and erroresFiltros.containsKey('disponibilidad')}" th:text="${erroresFiltros.get('disponibilidad')}"></p>
                <p class="empty" th:if="${colaboradores.isEmpty() and erroresFiltros.isEmpty()}">No hay colaboradores que coincidan con los filtros.</p>

                <div class="table-wrap" th:unless="${colaboradores.isEmpty()}">
                    <table class="directorio-tabla" th:classappend="${verCapacidad ? '' : 'sin-capacidad'}">
                        <thead>
                            <tr>
                                <th scope="col">Colaborador</th>
                                <th scope="col">Cargo</th>
                                <th scope="col">Área</th>
                                <th scope="col">Nivel profesional</th>
                                <th scope="col" th:if="${verCapacidad}">Disponible hoy</th>
                                <th scope="col">Estado de cuenta</th>
                                <th scope="col">Perfil</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${colaboradores}" th:with="cuenta=${c.usuario},estadoCuenta=${c.usuario.estado?.name()}">
                                <td>
                                    <div class="table-user">
                                        <span th:replace="~{fragments/perfil :: avatar(${cuenta}, @{/resource/colaboradores/fotos/{id}(id=${c.idColaborador})}, 'mini-avatar')}"></span>
                                        <div><strong th:text="${cuenta.nombreCompleto}"></strong><small th:text="${cuenta.correo}"></small></div>
                                    </div>
                                </td>
                                <td th:text="${c.cargo ?: 'Por definir'}"></td>
                                <td><span class="badge badge-blue" th:text="${c.area ?: 'Por definir'}"></span></td>
                                <td>
                                    <span class="badge badge-purple" th:if="${c.seniority != null}" th:text="${c.seniority.etiqueta}"></span>
                                    <span class="muted" th:unless="${c.seniority != null}">Sin registrar</span>
                                </td>
                                <td class="disponibilidad" th:if="${verCapacidad}" th:with="carga=${capacidades.get(c.idColaborador)}">
                                    <strong th:text="|${carga.disponibilidad} %|"></strong>
                                    <div class="progress green" aria-hidden="true"><span th:style="|width:${carga.disponibilidad}%|"></span></div>
                                    <small class="muted" th:text="|Base ${carga.disponibilidadBase} % · Carga ${carga.carga} %|"></small>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${estadoCuenta == 'ACTIVO' ? 'badge-success' : (estadoCuenta == 'BLOQUEADO' ? 'badge-danger' : 'badge-warning')}"
                                          th:text="${estadoCuenta != null ? #strings.capitalize(#strings.toLowerCase(estadoCuenta)) : 'Sin estado'}"></span>
                                </td>
                                <td>
                                    <a class="accion-perfil" th:href="@{/resource/colaboradores/{id}(id=${c.idColaborador})}"
                                       th:aria-label="|Ver perfil de ${cuenta.nombreCompleto}|">Ver perfil</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <footer class="directorio-pie" th:if="${resultados > 0}">
                    <p class="muted" th:text="|Mostrando ${desde}–${hasta} de ${resultados} ${resultados == 1 ? 'colaborador' : 'colaboradores'}|"></p>
                    <nav class="directorio-paginas" th:if="${totalPaginas > 1}" aria-label="Paginación del directorio"
                         th:with="primera=${paginaActual > 3 ? paginaActual - 2 : 1},ultima=${paginaActual + 2 < totalPaginas ? paginaActual + 2 : totalPaginas}">
                        <span class="btn btn-light btn-sm" th:if="${paginaActual == 1}" aria-disabled="true">Anterior</span>
                        <a class="btn btn-light btn-sm" th:if="${paginaActual > 1}" th:href="@{/resource/colaboradores(q=${q},nivel=${nivelSeleccionado?.name()},disponibilidad=${disponibilidadSeleccionada?.name()},estado=${estadoSeleccionado?.name()},page=${paginaActual - 1})}">Anterior</a>
                        <a class="btn btn-sm" th:each="numero : ${#numbers.sequence(primera, ultima)}"
                           th:classappend="${numero == paginaActual ? 'btn-primary' : 'btn-light'}"
                           th:attr="aria-current=${numero == paginaActual ? 'page' : null}"
                           th:href="@{/resource/colaboradores(q=${q},nivel=${nivelSeleccionado?.name()},disponibilidad=${disponibilidadSeleccionada?.name()},estado=${estadoSeleccionado?.name()},page=${numero})}" th:text="${numero}"></a>
                        <a class="btn btn-light btn-sm" th:if="${paginaActual < totalPaginas}" th:href="@{/resource/colaboradores(q=${q},nivel=${nivelSeleccionado?.name()},disponibilidad=${disponibilidadSeleccionada?.name()},estado=${estadoSeleccionado?.name()},page=${paginaActual + 1})}">Siguiente</a>
                        <span class="btn btn-light btn-sm" th:if="${paginaActual == totalPaginas}" aria-disabled="true">Siguiente</span>
                    </nav>
                </footer>
            </section>
        </div>
    </main>
</div>
</body>
</html>
