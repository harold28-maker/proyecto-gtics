<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colaboradores | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="page-intro"><div><h2>Directorio de talento</h2><p>Consulta perfiles, cargo, área, seniority y disponibilidad base de los colaboradores.</p></div></section><section class="card"><form class="filters" method="get"><input class="search" name="q" th:value="${q}" placeholder="Buscar colaborador, cargo o habilidad"><select class="compact"><option>Todos los niveles</option><option>JUNIOR</option><option>SEMI_SENIOR</option><option>SENIOR</option><option>LEAD</option></select><button class="btn btn-light">Buscar</button><a class="btn btn-light" th:href="@{/resource/colaboradores}">Limpiar</a></form><div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Cargo</th><th>Área</th><th>Seniority</th><th>Disponibilidad base</th><th>Estado</th></tr></thead><tbody><tr th:each="c : ${colaboradores}"><td><div class="table-user"><span class="mini-avatar" th:text="${#strings.substring(c.usuario.nombres,0,1)}"></span><div><strong th:text="${c.usuario.nombreCompleto}"></strong><small th:text="${c.usuario.correo}"></small></div></div></td><td th:text="${c.cargo}"></td><td><span class="badge badge-blue" th:text="${c.area}"></span></td><td><span class="badge badge-purple" th:text="${c.seniority}"></span></td><td style="min-width:150px"><div class="progress green"><span th:style="|width:${c.disponibilidadBase}%|"></span></div><small th:text="|${c.disponibilidadBase}%|"></small></td><td><span class="badge badge-success" th:text="${c.usuario.estado}"></span></td></tr></tbody></table></div></section></div></main></div></body></html>
