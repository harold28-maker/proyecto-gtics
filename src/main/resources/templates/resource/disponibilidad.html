<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilidad | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><div class="grid-4 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm green"><div class="metric-icon">✓</div><div class="label">Disponibles</div><div class="value" th:text="${disponibles}"></div><div class="hint">50% o más</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm orange"><div class="metric-icon">◫</div><div class="label">Parcialmente disponibles</div><div class="value" th:text="${parciales}"></div><div class="hint">Entre 1% y 49%</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><div class="metric-icon">×</div><div class="label">Sin disponibilidad</div><div class="value" th:text="${sinDisponibilidad}"></div><div class="hint" style="color:var(--red)">0% disponible</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm blue"><div class="metric-icon">♙</div><div class="label">Colaboradores</div><div class="value" th:text="${#lists.size(cargas)}"></div><div class="hint">Perfiles evaluados</div></div></div><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm section"><div class="card-title mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><h2>Vista general de disponibilidad</h2><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-purple bg-brand-50 text-brand-700">Base - carga activa</span></div><div class="table-wrap overflow-x-auto rounded-xl border border-gray-200"><table class="w-full min-w-[720px] border-collapse text-left text-sm"><thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wide text-gray-500"><tr><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Colaborador</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Rol principal</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Disponibilidad base</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Carga actual</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Disponible</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Clasificación</th></tr></thead><tbody class="divide-y divide-gray-100 bg-white"><tr th:each="c : ${cargas}"><td class="px-4 py-3 align-middle text-sm text-gray-700"><strong th:text="${c.colaborador}"></strong><br><small class="muted" th:text="${c.area}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${c.cargo}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="|${c.disponibilidadBase}%|"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="progress orange"><span th:style="|width:${c.carga > 100 ? 100 : c.carga}%|"></span></div><small th:text="|${c.carga}%|"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="progress green"><span th:style="|width:${c.disponibilidad}%|"></span></div><small th:text="|${c.disponibilidad}%|"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold" th:classappend="${c.disponibilidad >= 50} ? ' badge-success' : (${c.disponibilidad > 0} ? ' badge-warning' : ' badge-danger')" th:text="${c.disponibilidad >= 50 ? 'DISPONIBLE' : (c.disponibilidad > 0 ? 'PARCIAL' : 'NO DISPONIBLE')}"></span></td></tr></tbody></table></div></section></div></main></div></body></html>
