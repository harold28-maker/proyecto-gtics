<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilidad | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><div class="grid-4"><div class="metric green"><div class="metric-icon">✓</div><div class="label">Disponibles</div><div class="value" th:text="${disponibles}"></div><div class="hint">50% o más</div></div><div class="metric orange"><div class="metric-icon">◫</div><div class="label">Parcialmente disponibles</div><div class="value" th:text="${parciales}"></div><div class="hint">Entre 1% y 49%</div></div><div class="metric"><div class="metric-icon">×</div><div class="label">Sin disponibilidad</div><div class="value" th:text="${sinDisponibilidad}"></div><div class="hint" style="color:var(--red)">0% disponible</div></div><div class="metric blue"><div class="metric-icon">♙</div><div class="label">Colaboradores</div><div class="value" th:text="${#lists.size(cargas)}"></div><div class="hint">Perfiles evaluados</div></div></div><section class="card section"><div class="card-title"><h2>Vista general de disponibilidad</h2><span class="badge badge-purple">Base - carga activa</span></div><div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Rol principal</th><th>Disponibilidad base</th><th>Carga actual</th><th>Disponible</th><th>Clasificación</th></tr></thead><tbody><tr th:each="c : ${cargas}"><td><strong th:text="${c.colaborador}"></strong><br><small class="muted" th:text="${c.area}"></small></td><td th:text="${c.cargo}"></td><td th:text="|${c.disponibilidadBase}%|"></td><td><div class="progress orange"><span th:style="|width:${c.carga > 100 ? 100 : c.carga}%|"></span></div><small th:text="|${c.carga}%|"></small></td><td><div class="progress green"><span th:style="|width:${c.disponibilidad}%|"></span></div><small th:text="|${c.disponibilidad}%|"></small></td><td><span class="badge" th:classappend="${c.disponibilidad >= 50} ? ' badge-success' : (${c.disponibilidad > 0} ? ' badge-warning' : ' badge-danger')" th:text="${c.disponibilidad >= 50 ? 'DISPONIBLE' : (c.disponibilidad > 0 ? 'PARCIAL' : 'NO DISPONIBLE')}"></span></td></tr></tbody></table></div></section></div></main></div></body></html>
