<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Asignación | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/resource-gestion.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content">
            <div th:replace="~{fragments/asignacion-formulario :: contenido}"></div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<script>
    if (typeof TomSelect === 'function') {
        new TomSelect('#idColaborador', {create: false, placeholder: 'Busca un colaborador...'});
    }
</script>
</body>
</html>
