<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carga de trabajo | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><div class="grid-3 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3"><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><div class="metric-icon">▤</div><div class="label">Carga promedio</div><div class="value" th:text="|${cargaPromedio}%|"></div><div class="hint">Del equipo</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm green"><div class="metric-icon">✓</div><div class="label">Capacidad saludable</div><div class="value" th:text="${#lists.size(cargas)}"></div><div class="hint">Perfiles evaluados</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm blue"><div class="metric-icon">⌁</div><div class="label">Modelo de cálculo</div><div class="value" style="font-size:18px">Asignaciones</div><div class="hint">ACTIVA + PLANIFICADA</div></div></div><div class="grid-3 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3 section"><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm" style="grid-column:span 2"><div class="card-title mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><h2>Distribución de carga</h2></div><div class="bar-list"><div class="bar-item" th:each="c : ${cargas}"><span th:text="${c.colaborador}"></span><div class="bar-track"><span th:style="|width:${c.carga > 100 ? 100 : c.carga}%|"></span></div><strong th:text="|${c.carga}%|"></strong></div></div></section><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><div class="card-title mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><h2>Promedio del equipo</h2></div><div class="donut-wrap"><div class="donut" th:style="|--value:${cargaPromedio}|"><div class="donut-label"><strong th:text="|${cargaPromedio}%|"></strong><small>carga media</small></div></div></div><p class="muted" style="text-align:center;margin-top:18px">Compara la carga asignada con la disponibilidad base declarada por cada colaborador.</p></section></div></div></main></div></body></html>
