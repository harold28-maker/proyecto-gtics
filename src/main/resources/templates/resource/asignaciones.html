<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asignaciones | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><div class="grid-4 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><div class="metric-icon">☷</div><div class="label">Asignaciones</div><div class="value" th:text="${#lists.size(asignaciones)}"></div><div class="hint">Total registrado</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm green"><div class="metric-icon">✓</div><div class="label">Activas</div><div class="value" th:text="${activas}"></div><div class="hint">En curso</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm blue"><div class="metric-icon">◷</div><div class="label">Planificadas</div><div class="value" th:text="${planificadas}"></div><div class="hint">Próximas</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm orange"><div class="metric-icon">◆</div><div class="label">Finalizadas</div><div class="value" th:text="${finalizadas}"></div><div class="hint">Históricas</div></div></div><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm section"><div class="filters flex flex-col gap-3 rounded-xl bg-gray-50 p-3 sm:flex-row sm:flex-wrap sm:items-center"><input class="search w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" placeholder="Buscar asignación"><select class="compact w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100"><option>Todos los proyectos</option></select><select class="compact w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100"><option>Todos los estados</option></select><button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100">Filtros</button></div><div class="table-wrap overflow-x-auto rounded-xl border border-gray-200"><table class="w-full min-w-[720px] border-collapse text-left text-sm"><thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wide text-gray-500"><tr><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Colaborador</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Proyecto</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Rol</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Fecha inicio</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Fecha fin</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Carga</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Estado</th></tr></thead><tbody class="divide-y divide-gray-100 bg-white"><tr th:each="a : ${asignaciones}"><td class="px-4 py-3 align-middle text-sm text-gray-700"><strong th:text="${a.colaborador.usuario.nombreCompleto}"></strong><br><small class="muted" th:text="${a.colaborador.cargo}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${a.proyecto.nombre}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${a.rolProyecto}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${a.fechaInicio}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${a.fechaFin ?: '-'}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="progress"><span th:style="|width:${a.porcentajeDedicacion}%|"></span></div><small th:text="|${a.porcentajeDedicacion}%|"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold" th:classappend="${a.estado.name() == 'ACTIVA'} ? ' badge-success' : ' badge-warning'" th:text="${a.estado}"></span></td></tr></tbody></table></div></section></div></main></div></body></html>
