<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talent Matching IA | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="card hero-card"><p class="eyebrow">Solicitud de búsqueda</p><div class="page-intro"><div><h2>Encuentra candidatos compatibles</h2><p>Selecciona un proyecto y revisa recomendaciones previamente calculadas y almacenadas en la base de datos.</p></div><span class="badge badge-purple">AI Talent Matching</span></div><div class="form-grid"><div class="form-group"><label>Proyecto</label><select><option th:each="p : ${proyectos}" th:text="${p.nombre}"></option></select></div><div class="form-group"><label>Necesidad</label><input value="Backend Java / Spring Boot / Docker" readonly></div></div><div class="tags" style="margin-top:14px"><span class="tag">Java</span><span class="tag">Spring Boot</span><span class="tag">Docker</span><span class="tag">Disponibilidad</span></div></section><section class="card section"><div class="card-title"><h2>Candidatos recomendados</h2><span class="badge badge-success" th:text="|${#lists.size(recomendaciones)} candidatos|"></span></div><article class="talent-card" th:each="r : ${recomendaciones}"><div class="match-score" th:text="|${r.porcentajeMatch}%|"></div><div><h3 style="margin:0 0 5px" th:text="${r.colaborador.usuario.nombreCompleto}"></h3><p class="muted" style="margin:0" th:text="|${r.colaborador.cargo} · ${r.colaborador.seniority}|"></p><p class="muted" th:text="${r.justificacion}"></p><div class="tags"><span class="tag" th:text="${r.proyecto.nombre}"></span><span class="tag" th:text="|Disponibilidad base ${r.colaborador.disponibilidadBase}%|"></span></div></div><span class="badge badge-purple">Recomendado</span></article></section></div></main></div></body></html>
