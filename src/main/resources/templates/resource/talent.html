<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talent Matching IA | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm hero-card"><p class="eyebrow">Solicitud de búsqueda</p><div class="page-intro flex flex-col gap-4 border-b border-gray-100 pb-5 md:flex-row md:items-end md:justify-between"><div><h2>Encuentra candidatos compatibles</h2><p>Selecciona un proyecto y revisa recomendaciones previamente calculadas y almacenadas en la base de datos.</p></div><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-purple bg-brand-50 text-brand-700">AI Talent Matching</span></div><div class="form-grid grid grid-cols-1 gap-5 md:grid-cols-2"><div class="form-group space-y-2"><label>Proyecto</label><select class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100"><option th:each="p : ${proyectos}" th:text="${p.nombre}"></option></select></div><div class="form-group space-y-2"><label>Necesidad</label><input class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" value="Backend Java / Spring Boot / Docker" readonly></div></div><div class="tags" style="margin-top:14px"><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700">Java</span><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700">Spring Boot</span><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700">Docker</span><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700">Disponibilidad</span></div></section><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm section"><div class="card-title mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><h2>Candidatos recomendados</h2><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-success bg-success-50 text-success-700" th:text="|${#lists.size(recomendaciones)} candidatos|"></span></div><article class="talent-card" th:each="r : ${recomendaciones}"><div class="match-score" th:text="|${r.porcentajeMatch}%|"></div><div><h3 style="margin:0 0 5px" th:text="${r.colaborador.usuario.nombreCompleto}"></h3><p class="muted" style="margin:0" th:text="|${r.colaborador.cargo} · ${r.colaborador.seniority}|"></p><p class="muted" th:text="${r.justificacion}"></p><div class="tags"><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700" th:text="${r.proyecto.nombre}"></span><span class="tag inline-flex items-center rounded-full border border-brand-100 bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700" th:text="|Disponibilidad base ${r.colaborador.disponibilidadBase}%|"></span></div></div><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-purple bg-brand-50 text-brand-700">Recomendado</span></article></section></div></main></div></body></html>
