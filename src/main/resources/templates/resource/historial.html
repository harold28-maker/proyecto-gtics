<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proyectos anteriores | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><div class="grid-3 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3"><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><div class="metric-icon">◷</div><div class="label">Proyectos registrados</div><div class="value" th:text="${#lists.size(proyectos)}"></div><div class="hint">Histórico disponible</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm green"><div class="metric-icon">✓</div><div class="label">Completados</div><div class="value" th:text="${completados}"></div><div class="hint">Finalizados con éxito</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm orange"><div class="metric-icon">×</div><div class="label">Cancelados</div><div class="value" th:text="${cancelados}"></div><div class="hint">Registro histórico</div></div></div><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm section"><div class="table-wrap overflow-x-auto rounded-xl border border-gray-200"><table class="w-full min-w-[720px] border-collapse text-left text-sm"><thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wide text-gray-500"><tr><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Proyecto</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Project Manager</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Periodo</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Estado</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Vacantes</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Progreso</th></tr></thead><tbody class="divide-y divide-gray-100 bg-white"><tr th:each="p : ${proyectos}"><td class="px-4 py-3 align-middle text-sm text-gray-700"><strong th:text="${p.nombre}"></strong><br><small class="muted" th:text="${p.descripcion}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${p.projectManager.nombreCompleto}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span th:text="${p.fechaInicio}"></span><br><small class="muted" th:text="${p.fechaFin ?: '-'}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold" th:classappend="${p.estado.name() == 'COMPLETED'} ? ' badge-success' : ' badge-purple'" th:text="${p.estado}"></span></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${p.vacantes}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="progress"><span th:style="|width:${p.progreso}%|"></span></div><small th:text="|${p.progreso}%|"></small></td></tr></tbody></table></div></section></div></main></div></body></html>
