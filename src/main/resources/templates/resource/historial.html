<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proyectos anteriores | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><div class="grid-3"><div class="metric"><div class="metric-icon">◷</div><div class="label">Proyectos registrados</div><div class="value" th:text="${#lists.size(proyectos)}"></div><div class="hint">Histórico disponible</div></div><div class="metric green"><div class="metric-icon">✓</div><div class="label">Completados</div><div class="value" th:text="${completados}"></div><div class="hint">Finalizados con éxito</div></div><div class="metric orange"><div class="metric-icon">×</div><div class="label">Cancelados</div><div class="value" th:text="${cancelados}"></div><div class="hint">Registro histórico</div></div></div><section class="card section"><div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Project Manager</th><th>Periodo</th><th>Estado</th><th>Vacantes</th><th>Progreso</th></tr></thead><tbody><tr th:each="p : ${proyectos}"><td><strong th:text="${p.nombre}"></strong><br><small class="muted" th:text="${p.descripcion}"></small></td><td th:text="${p.projectManager.nombreCompleto}"></td><td><span th:text="${p.fechaInicio}"></span><br><small class="muted" th:text="${p.fechaFin ?: '-'}"></small></td><td><span class="badge" th:classappend="${p.estado.name() == 'COMPLETED'} ? ' badge-success' : ' badge-purple'" th:text="${p.estado}"></span></td><td th:text="${p.vacantes}"></td><td><div class="progress"><span th:style="|width:${p.progreso}%|"></span></div><small th:text="|${p.progreso}%|"></small></td></tr></tbody></table></div></section></div></main></div></body></html>
