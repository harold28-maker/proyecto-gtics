<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo} · SkillBridge AI|">Categoría | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside>

    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>

        <div class="content">
            <section class="card form-card" aria-labelledby="titulo-categoria">
                <div class="page-intro">
                    <h2 id="titulo-categoria" th:text="${titulo}">Nueva categoría</h2>
                </div>

                <form th:action="@{/admin/categorias/guardar}" method="post">
                    <input type="hidden" name="idCategoria" th:if="${idCategoria != null}" th:value="${idCategoria}">
                    <input type="hidden" name="q" th:value="${q}">

                    <div class="form-group">
                        <label for="nombre">Nombre <span class="required">*</span></label>
                        <input id="nombre" type="text" name="nombre" th:value="${nombreCategoria}"
                               th:classappend="${errorNombre != null} ? ' is-invalid' : ''"
                               th:attr="aria-invalid=${errorNombre != null}"
                               placeholder="Ej. Base de datos" maxlength="30" required
                               aria-describedby="ayuda-nombre error-nombre">
                        <div class="field-error" id="error-nombre" th:text="${errorNombre}"></div>
                        <p class="form-note" id="ayuda-nombre" th:text="${idCategoria == null
                            ? 'Máximo 30 caracteres.'
                            : 'El cambio de nombre también se aplicará a las habilidades vinculadas.'}">
                            Máximo 30 caracteres.
                        </p>
                    </div>

                    <div class="form-actions">
                        <a class="btn btn-light" th:href="@{/admin/categorias(q=${q})}">Cancelar</a>
                        <button class="btn btn-primary" type="submit"
                                th:text="${idCategoria == null ? 'Guardar categoría' : 'Guardar nombre'}">
                            Guardar categoría
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>
