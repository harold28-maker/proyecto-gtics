<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Auditoría | SkillBridge AI</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body>

<div class="app-shell">

    <aside th:replace="~{fragments/layout :: sidebar('ADMIN')}">
    </aside>

    <main class="main">

        <header th:replace="~{fragments/layout :: topbar(${titulo})}">
        </header>

        <div class="content audit-management">

            <section class="page-intro">
                <h2>Registro de actividad</h2>
            </section>

            <section class="card" aria-label="Registro de actividad">

                <form class="filters audit-filters" method="get" th:action="@{/admin/auditoria}">
                    <label class="audit-search">
                        Buscar en el registro
                        <input class="input" type="search" name="q" th:value="${q}"
                               placeholder="Usuario, acción o detalle">
                    </label>

                    <label>
                        Módulo
                        <select name="modulo">
                            <option value="">Todos los módulos</option>
                            <option th:each="m : ${modulos}"
                                    th:value="${m}" th:text="${m}" th:selected="${m == modulo}"></option>
                        </select>
                    </label>

                    <label class="audit-date-filter">
                        Desde
                        <input class="input" type="date" name="desde" th:value="${desde}">
                    </label>

                    <label class="audit-date-filter">
                        Hasta
                        <input class="input" type="date" name="hasta" th:value="${hasta}">
                    </label>

                    <button class="btn btn-light" type="submit">Buscar</button>
                    <a class="btn btn-light" th:href="@{/admin/auditoria}">Limpiar</a>
                </form>

                <div class="alert-error" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>

                <th:block th:if="${resultados != null}">
                    <div class="empty" th:if="${resultados.isEmpty()}">
                        No se encontraron registros de auditoría.
                    </div>

                    <th:block th:unless="${resultados.isEmpty()}">
                        <div class="table-wrap">
                            <table>
                                <thead>
                                <tr>
                                    <th scope="col">Fecha y hora</th>
                                    <th scope="col">Usuario</th>
                                    <th scope="col">Acción</th>
                                    <th scope="col">Módulo</th>
                                    <th scope="col">Detalle</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="a : ${resultados.content}">
                                    <td class="audit-time" th:text="${a.fecha != null
                                        ? #temporals.format(a.fecha, 'dd/MM/yyyy HH:mm') : '-'}">
                                        22/11/2026 23:30
                                    </td>
                                    <td><strong th:text="${a.usuario != null ? a.usuario.nombreCompleto : 'Sistema'}"></strong></td>
                                    <td th:text="${a.accion}"></td>
                                    <td>
                                        <span class="badge badge-purple" th:text="${a.modulo != null ? a.modulo : '-'}"></span>
                                    </td>
                                    <td class="audit-detail" th:text="${a.detalle != null ? a.detalle : '-'}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="audit-footer">
                            <span class="audit-count"
                                  th:text="|${primerRegistro}–${ultimoRegistro} de ${resultados.totalElements} ${resultados.totalElements == 1 ? 'registro' : 'registros'}|">
                                1–10 de 68 registros
                            </span>

                            <nav th:if="${resultados.totalPages > 1}" aria-label="Páginas de auditoría">
                                <form class="audit-pages" method="get" th:action="@{/admin/auditoria}">
                                    <input type="hidden" name="q" th:value="${q}">
                                    <input type="hidden" name="modulo" th:value="${modulo}">
                                    <input type="hidden" name="desde" th:value="${desde}">
                                    <input type="hidden" name="hasta" th:value="${hasta}">

                                    <button class="btn btn-light btn-sm" type="submit" name="pagina"
                                            th:value="${paginaActual - 1}" th:disabled="${!resultados.hasPrevious()}">
                                        Anterior
                                    </button>
                                    <button class="btn btn-light btn-sm" type="submit" name="pagina" value="1"
                                            th:if="${primeraPaginaVisible > 1}">1</button>
                                    <span aria-hidden="true" th:if="${primeraPaginaVisible > 2}">…</span>
                                    <button class="btn btn-light btn-sm" type="submit" name="pagina"
                                            th:each="n : ${#numbers.sequence(primeraPaginaVisible, ultimaPaginaVisible)}"
                                            th:value="${n}" th:text="${n}"
                                            th:attr="aria-current=${n == paginaActual ? 'page' : null}">1</button>
                                    <span aria-hidden="true" th:if="${ultimaPaginaVisible < resultados.totalPages - 1}">…</span>
                                    <button class="btn btn-light btn-sm" type="submit" name="pagina"
                                            th:if="${ultimaPaginaVisible < resultados.totalPages}"
                                            th:value="${resultados.totalPages}" th:text="${resultados.totalPages}">7</button>
                                    <button class="btn btn-light btn-sm" type="submit" name="pagina"
                                            th:value="${paginaActual + 1}" th:disabled="${!resultados.hasNext()}">
                                        Siguiente
                                    </button>
                                </form>
                            </nav>
                        </div>
                    </th:block>
                </th:block>
            </section>

        </div>

    </main>

</div>

</body>

</html>
