<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Categorías | SkillBridge AI
    </title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>

<body>

<div class="app-shell">


    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('ADMIN')}">
    </aside>


    <main class="main">


        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar(${titulo})}">
        </header>


        <div class="content categories-management">

            <div class="alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
            <div class="alert-error" th:if="${mensajeError}" th:text="${mensajeError}"></div>

            <div class="page-intro">
                <h2>Categorías de habilidades</h2>
                <a class="btn btn-primary" th:href="@{/admin/categorias/nueva(q=${q})}">
                    ＋ Nueva categoría
                </a>
            </div>


            <!-- =========================================
                 INDICADORES
                 ========================================= -->

            <div class="grid-2">


                <!-- CATEGORÍAS -->

                <div class="metric">

                    <div class="label">
                        Categorías
                    </div>

                    <div class="value"
                         th:text="${totalCategorias}">
                        0
                    </div>

                    <div class="hint">
                        Registradas en el catálogo
                    </div>

                </div>


                <!-- HABILIDADES -->

                <div class="metric green">

                    <div class="label">
                        Habilidades
                    </div>

                    <div class="value"
                         th:text="${totalHabilidades}">
                        0
                    </div>

                    <div class="hint">
                        Registradas en total
                    </div>

                </div>


            </div>


            <!-- =========================================
                 CATEGORÍAS
                 ========================================= -->

            <section class="card section" aria-label="Categorías registradas">
                <form class="filters categories-filters" method="get" th:action="@{/admin/categorias}">
                    <label>
                        Buscar categoría
                        <input class="input" type="search" name="q" th:value="${q}" placeholder="Ej. Backend">
                    </label>
                    <button class="btn btn-light" type="submit">Buscar</button>
                    <a class="btn btn-light" th:href="@{/admin/categorias}">Limpiar</a>
                </form>

                <div class="table-wrap" th:unless="${#lists.isEmpty(categorias)}">
                    <table>
                        <thead>
                        <tr>
                            <th scope="col">Categoría</th>
                            <th scope="col">Habilidades</th>
                            <th scope="col">Activas</th>
                            <th scope="col">Inactivas</th>
                            <th scope="col">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="categoria : ${categorias}">
                            <td><strong th:text="${categoria.nombre}"></strong></td>
                            <td class="category-count" th:text="${categoria.totalHabilidades}">0</td>
                            <td class="category-count category-active" th:text="${categoria.activas}">0</td>
                            <td class="category-count muted" th:text="${categoria.totalHabilidades - categoria.activas}">0</td>
                            <td>
                                <div class="action-row">
                                    <a class="btn btn-light btn-sm category-link"
                                       th:unless="${permisosBloqueados.contains('habilidades')}"
                                       th:href="@{/admin/habilidades(categoriaFiltro=${categoria.nombre})}">
                                        Ver habilidades
                                    </a>
                                    <a class="btn btn-light btn-sm"
                                       th:href="@{/admin/categorias/editar/{id}(id=${categoria.idCategoria}, q=${q})}">
                                        Renombrar
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty"
                     th:if="${#lists.isEmpty(categorias)}"
                     th:text="${totalCategorias == 0 ? 'Aún no hay categorías registradas.' : 'No se encontraron categorías.'}">
                    No se encontraron categorías.
                </div>
            </section>


        </div>


    </main>


</div>


</body>

</html>
