<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Categorías | SkillBridge AI
    </title>



<link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head>

<body>

<div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900">


    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('ADMIN')}">
    </aside>


    <main class="main min-w-0">


        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar(${titulo})}">
        </header>


        <div class="content mx-auto w-full max-w-[1600px]">


            <!-- =========================================
                 INDICADORES
                 ========================================= -->

            <div class="grid-2 grid grid-cols-1 gap-5 lg:grid-cols-2">


                <!-- CATEGORÍAS -->

                <div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm">

                    <div class="label">
                        Categorías
                    </div>

                    <div class="value"
                         th:text="${totalCategorias}">
                        0
                    </div>

                    <div class="hint">
                        Registradas en el catálogo
                    </div>

                </div>


                <!-- HABILIDADES -->

                <div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm green">

                    <div class="label">
                        Habilidades
                    </div>

                    <div class="value"
                         th:text="${totalHabilidades}">
                        0
                    </div>

                    <div class="hint">
                        Registradas en total
                    </div>

                </div>


            </div>


            <!-- =========================================
                 CATEGORÍAS
                 ========================================= -->

            <section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm section">


                <!-- CABECERA -->

                <div class="categories-card-header">


                    <div>

                        <h2>
                            Categorías registradas
                        </h2>

                        <p class="muted mb-0">
                            Organiza las habilidades registradas según su categoría.
                        </p>

                    </div>


                    <a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-primary bg-brand-600 text-white hover:bg-brand-700 focus:ring-brand-100"
                       th:href="@{/admin/habilidades/nueva}">

                        ＋ Agregar habilidad

                    </a>


                </div>


                <!-- =========================================
                     LISTADO DE CATEGORÍAS
                     ========================================= -->

                <div class="categories-grid">


                    <article class="category-card"
                             th:each="entry : ${categorias}">


                        <h3 th:text="${entry.key}">
                            Backend
                        </h3>


                        <p class="muted">

                            <strong th:text="${entry.value}">
                                3
                            </strong>

                            <span th:text="${entry.value == 1
                                ? ' habilidad'
                                : ' habilidades'}">

                                habilidades

                            </span>

                        </p>


                    </article>


                </div>


                <!-- SIN RESULTADOS -->

                <div class="empty rounded-xl border border-dashed border-gray-300 bg-gray-50 px-5 py-8 text-center text-sm text-gray-500"
                     th:if="${#maps.isEmpty(categorias)}">

                    No hay categorías registradas.

                </div>


            </section>


        </div>


    </main>


</div>


</body>

</html>
