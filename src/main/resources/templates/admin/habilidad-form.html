<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Habilidad | SkillBridge AI</title>



<link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head>

<body>

<div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900">


    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('ADMIN')}">
    </aside>


    <main class="main min-w-0">


        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar(${titulo})}">
        </header>


        <div class="content mx-auto w-full max-w-[1600px]">


            <!-- =========================================
                 TEXTO SUPERIOR
                 ========================================= -->

            <div class="habilidad-form-info">

                <div>

                    <h3>
                        Datos de la habilidad
                    </h3>

                    <p th:text="${habilidad.idHabilidad == null
                        ? 'Registra la información de la nueva habilidad.'
                        : 'Actualiza la información de la habilidad.'}">

                        Registra la información de la nueva habilidad.

                    </p>

                </div>


                <span>
                    * Campos obligatorios
                </span>

            </div>


            <!-- =========================================
                 FORMULARIO
                 ========================================= -->

            <section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm form-card habilidad-form-card">


                <form id="habilidadForm"
                      th:action="@{/admin/habilidades/guardar}"
                      th:object="${habilidad}"
                      method="post">


                    <!-- ID -->
                    <input type="hidden"
                           th:field="*{idHabilidad}">


                    <div class="form-grid grid grid-cols-1 gap-5 md:grid-cols-2">


                        <!-- =================================
                             NOMBRE
                             ================================= -->

                        <div class="form-group space-y-2">

                            <label for="nombre">

                                Nombre
                                <span class="required">*</span>

                            </label>


                            <input class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" id="nombre"
                                   type="text"
                                   th:field="*{nombre}"
                                   maxlength="40"
                                   required
                                   placeholder="Ej. Spring Boot">


                            <p class="form-note">
                                Máximo 40 caracteres.
                            </p>

                        </div>


                        <!-- =================================
                             CATEGORÍA
                             ================================= -->

                        <div class="form-group space-y-2">

                            <label for="categoria">

                                Categoría
                                <span class="required">*</span>

                            </label>


                            <input class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" id="categoria"
                                   type="text"
                                   th:field="*{categoria}"
                                   maxlength="30"
                                   required
                                   placeholder="Ej. Backend">


                            <p class="form-note">
                                Máximo 30 caracteres.
                            </p>

                        </div>


                        <!-- =================================
                             DESCRIPCIÓN
                             ================================= -->

                        <div class="form-group space-y-2 full">

                            <label for="descripcion">

                                Descripción
                                <span class="required">*</span>

                            </label>


                            <textarea class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" id="descripcion"
                                      rows="5"
                                      th:field="*{descripcion}"
                                      maxlength="150"
                                      required
                                      placeholder="Describe el alcance o uso principal de la habilidad."></textarea>


                            <div class="habilidad-description-footer">

                                <p class="form-note">
                                    Máximo 150 caracteres.
                                </p>

                                <span id="descripcionContador">
                                    0 / 150
                                </span>

                            </div>

                        </div>


                        <!-- =================================
                             ESTADO
                             ================================= -->

                        <div class="form-group space-y-2">

                            <label for="estado">

                                Estado
                                <span class="required">*</span>

                            </label>


                            <select class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" id="estado"
                                    th:field="*{estado}"
                                    required>

                                <option th:value="true">
                                    Activa
                                </option>

                                <option th:value="false">
                                    Inactiva
                                </option>

                            </select>

                        </div>


                    </div>


                    <!-- =========================================
                         BOTONES
                         ========================================= -->

                    <div class="form-actions flex flex-col-reverse gap-3 border-t border-gray-100 pt-5 sm:flex-row sm:justify-end">


                        <a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100"
                           th:href="@{/admin/habilidades}">

                            Cancelar

                        </a>


                        <button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-primary bg-brand-600 text-white hover:bg-brand-700 focus:ring-brand-100"
                                type="submit">

                            <span th:text="${habilidad.idHabilidad == null
                                ? 'Guardar habilidad'
                                : 'Guardar cambios'}">

                                Guardar habilidad

                            </span>

                        </button>


                    </div>


                </form>


            </section>


        </div>


    </main>


</div>


<!-- =========================================
     CONTADOR DESCRIPCIÓN
     ========================================= -->

<script>

    const descripcion =
        document.getElementById("descripcion");

    const descripcionContador =
        document.getElementById("descripcionContador");


    function actualizarContadorDescripcion() {

        descripcionContador.textContent =
            descripcion.value.length + " / 150";

    }


    descripcion.addEventListener(
        "input",
        actualizarContadorDescripcion
    );


    actualizarContadorDescripcion();

</script>


</body>

</html>
