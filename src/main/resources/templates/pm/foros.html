<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Foro | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/project-manager.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content pm-ui">
            <th:block th:replace="~{pm/elementos :: avisos}"></th:block>
            <section class="page-intro">
                <div><h2>Foro de proyectos</h2><p>Consulta y documenta decisiones y soluciones con tu equipo.</p></div>
                <a class="btn btn-primary" th:href="@{/foros/nuevo}">Nueva publicación</a>
            </section>
            <section class="card">
                <form class="pm-filter" method="get" novalidate th:action="@{/pm/foros}">
                    <label class="pm-search">Buscar tema<input name="q" type="search" th:value="${q}" placeholder="Título, contenido o etiqueta">
                        <span th:replace="~{pm/elementos :: error(${erroresFiltros}, 'q')}"></span></label>
                    <label>Proyecto
                        <select name="idProyecto">
                            <option value="">Todos los proyectos</option>
                            <option value="0" th:selected="${proyectoSeleccionado == 0}">Temas generales</option>
                            <option th:each="p : ${proyectos}" th:value="${p.idProyecto}" th:text="${p.nombre}" th:selected="${proyectoSeleccionado == p.idProyecto}"></option>
                        </select>
                        <span th:replace="~{pm/elementos :: error(${erroresFiltros}, 'idProyecto')}"></span>
                    </label>
                    <label>Categoría
                        <select name="categoria">
                            <option value="TODAS">Todas las categorías</option>
                            <option th:each="cat : ${categoriasForo}" th:value="${cat}" th:text="${cat}" th:selected="${cat.equalsIgnoreCase(categoriaSeleccionada)}"></option>
                        </select>
                        <span th:replace="~{pm/elementos :: error(${erroresFiltros}, 'categoria')}"></span>
                    </label>
                    <label>Estado
                        <select name="estado">
                            <option value="TODOS">Todos los estados</option>
                            <option value="ABIERTO" th:selected="${estadoSeleccionado == 'ABIERTO'}">Abierto</option>
                            <option value="RESUELTO" th:selected="${estadoSeleccionado == 'RESUELTO'}">Resuelto</option>
                            <option value="CERRADO" th:selected="${estadoSeleccionado == 'CERRADO'}">Cerrado</option>
                        </select>
                        <span th:replace="~{pm/elementos :: error(${erroresFiltros}, 'estado')}"></span>
                    </label>
                    <button class="btn btn-primary" type="submit">Aplicar</button>
                    <a class="btn btn-light" th:href="@{/pm/foros}">Limpiar</a>
                </form>
                <th:block th:replace="~{pm/elementos :: error(${erroresFiltros}, 'page')}"></th:block>
                <header class="card-title">
                    <h3>Temas recientes</h3>
                    <small class="pm-meta" th:text="|${totalForos} ${totalForos == 1 ? 'tema' : 'temas'} · ${abiertos} ${abiertos == 1 ? 'abierto' : 'abiertos'} · ${resueltos} ${resueltos == 1 ? 'resuelto' : 'resueltos'} · ${cerrados} ${cerrados == 1 ? 'cerrado' : 'cerrados'}|"></small>
                </header>
                <div class="pm-temas">
                    <article class="pm-tema pm-linea" th:each="f : ${foros}"
                             th:with="cantidad=${conteoRespuestas[f.idForo]}, estadoTema=${f.estado == null ? 'ABIERTO' : f.estado.name()}">
                        <div>
                            <div class="pm-chips">
                                <span class="badge badge-blue" th:text="${f.proyecto == null ? 'Tema general' : f.proyecto.nombre}"></span>
                                <span class="badge badge-purple" th:text="${f.categoria ?: 'General'}"></span>
                            </div>
                            <h4><a th:href="@{/foros/{id}(id=${f.idForo})}" th:text="${f.titulo}"></a></h4>
                            <p class="pm-meta" th:text="${#strings.abbreviate(f.contenido, 180)}"></p>
                            <small class="pm-meta">
                                <strong th:text="${f.autor == null ? 'Autor no disponible' : f.autor.nombreCompleto}"></strong>
                                <span th:if="${f.fechaCreacion}" th:text="| · ${#temporals.format(f.fechaCreacion,'dd-MM-yyyy HH:mm')}|"></span>
                            </small>
                        </div>
                        <div class="pm-tema-estado">
                            <span class="badge" th:classappend="${estadoTema == 'RESUELTO' ? 'badge-success' : (estadoTema == 'CERRADO' ? 'badge-warning' : 'badge-purple')}"
                                  th:text="${estadoTema == 'RESUELTO' ? 'Resuelto' : (estadoTema == 'CERRADO' ? 'Cerrado' : 'Abierto')}"></span>
                            <small class="pm-meta">
                                <span th:text="${cantidad == 1 ? '1 respuesta' : cantidad + ' respuestas'}"></span>
                                <span th:if="${temasConSolucion.contains(f.idForo)}"> · Solución</span>
                            </small>
                        </div>
                    </article>
                </div>
                <p class="empty" th:if="${foros.isEmpty() and erroresFiltros.isEmpty()}">No se encontraron publicaciones para estos filtros.</p>
                <div class="pm-pie" th:if="${resultados > 0}">
                    <span class="pm-meta" th:text="|Mostrando ${desde}–${hasta} de ${resultados} publicaciones|"></span>
                    <nav class="pm-actions" th:if="${totalPaginas > 1}" aria-label="Páginas del foro">
                        <a class="btn btn-light btn-sm" th:if="${paginaActual > 1}"
                           th:href="@{/pm/foros(q=${q},idProyecto=${proyectoSeleccionado},categoria=${categoriaSeleccionada},estado=${estadoSeleccionado},page=${paginaActual - 1})}">Anterior</a>
                        <span class="pm-meta" aria-current="page" th:text="|Página ${paginaActual} de ${totalPaginas}|"></span>
                        <a class="btn btn-light btn-sm" th:if="${paginaActual < totalPaginas}"
                           th:href="@{/pm/foros(q=${q},idProyecto=${proyectoSeleccionado},categoria=${categoriaSeleccionada},estado=${estadoSeleccionado},page=${paginaActual + 1})}">Siguiente</a>
                    </nav>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
