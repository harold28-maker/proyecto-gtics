<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recomendaciones IA | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body>
    <div class="app-shell">
      <aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside>
      <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content">
          <section class="card hero-card">
            <div class="page-intro">
              <div>
                <p class="eyebrow">AI Talent Matching</p>
                <h2>Encuentra el mejor perfil para cada proyecto</h2>
                <p>
                  Las recomendaciones guardadas consideran coincidencia de
                  habilidades, experiencia y disponibilidad.
                </p>
              </div>
              <span class="badge badge-purple">Modelo de avance</span>
            </div>
            <form class="form-grid" method="get" th:action="@{/pm/recomendaciones}">
              <div class="form-group">
                <label for="proyecto">Proyecto</label
                ><select id="proyecto" name="proyecto">
                  <option value="">Todos los proyectos</option>
                  <option
                    th:each="p : ${proyectos}"
                    th:value="${p.idProyecto}"
                    th:text="${p.nombre}"
                    th:selected="${p.idProyecto == proyectoSeleccionado}"
                  ></option>
                </select>
              </div>
              <div class="form-group">
                <label>Descripción de necesidad</label
                ><input
                  value="Desarrollador backend con experiencia en Spring Boot y Docker"
                  readonly
                />
              </div>
              <div class="form-actions">
                <button class="btn btn-primary" type="submit">Actualizar recomendaciones</button>
                <a class="btn btn-light" th:href="@{/pm/recomendaciones}">Limpiar</a>
              </div>
            </form>
          </section>
          <section class="card section">
            <div class="card-title">
              <h2>Candidatos recomendados</h2>
              <span
                class="badge badge-success"
                th:text="|${#lists.size(recomendaciones)} resultados|"
              ></span>
            </div>
            <article class="talent-card" th:each="r : ${recomendaciones}">
              <div class="match-score" th:text="|${r.porcentajeMatch}%|"></div>
              <div>
                <h3
                  style="margin: 0 0 5px"
                  th:text="${r.colaborador.usuario.nombreCompleto}"
                ></h3>
                <p
                  class="muted"
                  style="margin: 0"
                  th:text="|${r.colaborador.cargo} · ${r.proyecto.nombre}|"
                ></p>
                <div class="tags" style="margin-top: 8px">
                  <span class="tag" th:text="${r.colaborador.seniority}"></span
                  ><span
                    class="tag"
                    th:text="|Disponibilidad ${r.colaborador.disponibilidadBase}%|"
                  ></span>
                </div>
                <p class="muted" th:text="${r.justificacion}"></p>
              </div>
              <a
                class="btn btn-primary btn-sm"
                th:href="@{/pm/asignaciones/nueva}"
                >Asignar</a
              >
            </article>
            <div class="empty" th:if="${#lists.isEmpty(recomendaciones)}">No hay recomendaciones para el proyecto seleccionado.</div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
