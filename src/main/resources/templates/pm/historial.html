<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historial | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><div class="grid-3"><div class="metric"><div class="metric-icon">◷</div><div class="label">Proyectos en historial</div><div class="value" th:text="${#lists.size(proyectos)}"></div><div class="hint">Portafolio registrado</div></div><div class="metric green"><div class="metric-icon">✓</div><div class="label">Finalizados</div><div class="value" th:text="${finalizados}"></div><div class="hint">Completados o cancelados</div></div><div class="metric blue"><div class="metric-icon">▥</div><div class="label">Trazabilidad</div><div class="value">100%</div><div class="hint">Información disponible</div></div></div><section class="card section"><div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Periodo</th><th>Estado</th><th>Prioridad</th><th>Progreso</th><th>Responsable</th></tr></thead><tbody><tr th:each="p : ${proyectos}"><td><strong th:text="${p.nombre}"></strong><br><small class="muted" th:text="${p.descripcion}"></small></td><td><span th:text="${p.fechaInicio}"></span><br><small class="muted" th:text="${p.fechaFin ?: '-'}"></small></td><td><span class="badge" th:classappend="${p.estado.name() == 'COMPLETED'} ? ' badge-success' : ' badge-purple'" th:text="${p.estado}"></span></td><td th:text="${p.prioridad}"></td><td><div class="progress"><span th:style="|width:${p.progreso}%|"></span></div><small th:text="|${p.progreso}%|"></small></td><td th:text="${p.projectManager.nombreCompleto}"></td></tr></tbody></table></div></section></div></main></div></body></html>
