<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asignaciones | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content">
    <div class="alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="grid-3"><div class="metric"><div class="metric-icon">☷</div><div class="label">Asignaciones</div><div class="value" th:text="${#lists.size(asignaciones)}"></div><div class="hint">Registradas</div></div><div class="metric green"><div class="metric-icon">✓</div><div class="label">Activas</div><div class="value" th:text="${activas}"></div><div class="hint">En ejecución</div></div><div class="metric blue"><div class="metric-icon">◷</div><div class="label">Planificadas</div><div class="value" th:text="${planificadas}"></div><div class="hint">Próximas</div></div></div>
    <div class="page-actions section"><div><p class="eyebrow">Staffing</p><p class="muted mb-0">Actualiza dedicación, fechas y estado sin perder el historial de participación.</p></div><a class="btn btn-primary" th:href="@{/pm/asignaciones/nueva}">＋ Nueva asignación</a></div>
    <section class="card"><div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Proyecto</th><th>Rol</th><th>Periodo</th><th>Carga</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
        <tr th:each="a : ${asignaciones}"><td><div class="table-user"><span class="mini-avatar" th:text="${a.colaborador.usuario.iniciales}"></span><div><strong th:text="${a.colaborador.usuario.nombreCompleto}"></strong><small th:text="${a.colaborador.cargo}"></small></div></div></td><td><strong th:text="${a.proyecto.nombre}"></strong></td><td th:text="${a.rolProyecto}"></td><td><span th:text="${a.fechaInicio}"></span><br><small class="muted" th:text="${a.fechaFin ?: '-'}"></small></td><td style="min-width:130px"><div class="progress"><span th:style="|width:${a.porcentajeDedicacion}%|"></span></div><small th:text="|${a.porcentajeDedicacion}%|"></small></td><td><span class="badge" th:classappend="${a.estado.name() == 'ACTIVA'} ? ' badge-success' : (${a.estado.name() == 'CANCELADA'} ? ' badge-danger' : ' badge-warning')" th:text="${a.estado}"></span></td><td><div class="action-row"><a class="btn btn-light btn-sm" th:href="@{/pm/asignaciones/editar/{id}(id=${a.idAsignacion})}">Editar</a><form th:if="${a.estado.name() != 'FINALIZADA' and a.estado.name() != 'CANCELADA'}" th:action="@{/pm/asignaciones/{id}/estado(id=${a.idAsignacion})}" method="post"><input type="hidden" name="estado" value="FINALIZADA"><button class="btn btn-success-soft btn-sm">Finalizar</button></form><form th:if="${a.estado.name() != 'CANCELADA' and a.estado.name() != 'FINALIZADA'}" th:action="@{/pm/asignaciones/{id}/estado(id=${a.idAsignacion})}" method="post"><input type="hidden" name="estado" value="CANCELADA"><button class="btn btn-danger-soft btn-sm">Cancelar</button></form></div></td></tr>
        </tbody></table></div><div class="empty" th:if="${#lists.isEmpty(asignaciones)}">No hay asignaciones registradas.</div></section>
</div></main></div></body></html>
