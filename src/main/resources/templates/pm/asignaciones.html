<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asignaciones | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head>
<body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]">
    <div class="alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="grid-3 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3"><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><div class="metric-icon">☷</div><div class="label">Asignaciones</div><div class="value" th:text="${#lists.size(asignaciones)}"></div><div class="hint">Registradas</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm green"><div class="metric-icon">✓</div><div class="label">Activas</div><div class="value" th:text="${activas}"></div><div class="hint">En ejecución</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm blue"><div class="metric-icon">◷</div><div class="label">Planificadas</div><div class="value" th:text="${planificadas}"></div><div class="hint">Próximas</div></div></div>
    <div class="page-actions section"><div><p class="eyebrow">Staffing</p><p class="muted mb-0">Actualiza dedicación, fechas y estado sin perder el historial de participación.</p></div><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-primary bg-brand-600 text-white hover:bg-brand-700 focus:ring-brand-100" th:href="@{/pm/asignaciones/nueva}">＋ Nueva asignación</a></div>
    <section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><div class="table-wrap overflow-x-auto rounded-xl border border-gray-200"><table class="w-full min-w-[720px] border-collapse text-left text-sm"><thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wide text-gray-500"><tr><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Colaborador</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Proyecto</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Rol</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Periodo</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Carga</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Estado</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Acciones</th></tr></thead><tbody class="divide-y divide-gray-100 bg-white">
        <tr th:each="a : ${asignaciones}"><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="table-user"><span class="mini-avatar" th:text="${a.colaborador.usuario.iniciales}"></span><div><strong th:text="${a.colaborador.usuario.nombreCompleto}"></strong><small th:text="${a.colaborador.cargo}"></small></div></div></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><strong th:text="${a.proyecto.nombre}"></strong></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${a.rolProyecto}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span th:text="${a.fechaInicio}"></span><br><small class="muted" th:text="${a.fechaFin ?: '-'}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700" style="min-width:130px"><div class="progress"><span th:style="|width:${a.porcentajeDedicacion}%|"></span></div><small th:text="|${a.porcentajeDedicacion}%|"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold" th:classappend="${a.estado.name() == 'ACTIVA'} ? ' badge-success' : (${a.estado.name() == 'CANCELADA'} ? ' badge-danger' : ' badge-warning')" th:text="${a.estado}"></span></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="action-row"><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light btn-sm border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100" th:href="@{/pm/asignaciones/editar/{id}(id=${a.idAsignacion})}">Editar</a><form th:if="${a.estado.name() != 'FINALIZADA' and a.estado.name() != 'CANCELADA'}" th:action="@{/pm/asignaciones/{id}/estado(id=${a.idAsignacion})}" method="post"><input type="hidden" name="estado" value="FINALIZADA"><button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-success-soft btn-sm bg-success-50 text-success-700 hover:bg-success-100 focus:ring-success-100">Finalizar</button></form><form th:if="${a.estado.name() != 'CANCELADA' and a.estado.name() != 'FINALIZADA'}" th:action="@{/pm/asignaciones/{id}/estado(id=${a.idAsignacion})}" method="post"><input type="hidden" name="estado" value="CANCELADA"><button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-danger-soft btn-sm border border-error-200 bg-error-50 text-error-700 hover:bg-error-100 focus:ring-error-100">Cancelar</button></form></div></td></tr>
        </tbody></table></div><div class="empty rounded-xl border border-dashed border-gray-300 bg-gray-50 px-5 py-8 text-center text-sm text-gray-500" th:if="${#lists.isEmpty(asignaciones)}">No hay asignaciones registradas.</div></section>
</div></main></div></body></html>
