<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Habilidades requeridas | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/project-manager.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content pm-ui">
            <th:block th:replace="~{pm/elementos :: avisos}"></th:block>
            <section class="page-intro">
                <div><h2>Habilidades requeridas</h2><p th:text="${proyecto.nombre}"></p></div>
                <a class="btn btn-light" th:href="@{/pm/proyectos}">Volver a Proyectos</a>
            </section>
            <div class="pm-dos-columnas">
                <section class="card">
                    <header class="card-title"><h3>Requerimientos del proyecto</h3></header>
                    <p class="empty" th:if="${requerimientos.isEmpty()}">Aún no hay habilidades requeridas.</p>
                    <div class="table-wrap" th:unless="${requerimientos.isEmpty()}">
                        <table>
                            <thead><tr><th scope="col">Habilidad</th><th scope="col">Nivel</th><th scope="col">Vacantes</th>
                                <th scope="col" th:unless="${proyecto.cerrado}">Acción</th></tr></thead>
                            <tbody><tr th:each="h : ${requerimientos}">
                                <td><strong th:text="${h.nombre}"></strong><small class="pm-meta" th:text="${h.categoria}"></small></td>
                                <td th:text="${h.nivel}"></td><td th:text="${h.vacantes}"></td>
                                <td th:unless="${proyecto.cerrado}"><form th:action="@{/pm/proyectos/{id}/habilidades/{habilidad}/eliminar(id=${proyecto.idProyecto},habilidad=${h.idHabilidad})}" method="post">
                                    <button class="btn btn-danger-soft btn-sm" type="submit">Retirar</button>
                                </form></td>
                            </tr></tbody>
                        </table>
                    </div>
                </section>
                <section class="card" th:unless="${proyecto.cerrado}">
                    <header class="card-title"><h3>Agregar o actualizar</h3></header>
                    <form class="pm-form" method="post" th:action="@{/pm/proyectos/{id}/habilidades/guardar(id=${proyecto.idProyecto})}" novalidate>
                        <div class="form-grid">
                            <div class="form-group full"><label for="idHabilidad">Habilidad</label><select id="idHabilidad" name="idHabilidad">
                                <option value="">Selecciona del catálogo</option><option th:each="h : ${catalogo}" th:value="${h.idHabilidad}" th:selected="${h.idHabilidad == habilidadSeleccionada}" th:text="${h.nombre}"></option>
                            </select><p th:replace="~{pm/elementos :: error(${erroresFiltros}, 'idHabilidad')}"></p></div>
                            <div class="form-group"><label for="nivel">Nivel requerido</label><select id="nivel" name="nivel">
                                <option value="BASICO" th:selected="${nivelSeleccionado == 'BASICO'}">Básico</option>
                                <option value="INTERMEDIO" th:selected="${nivelSeleccionado == 'INTERMEDIO'}">Intermedio</option>
                                <option value="AVANZADO" th:selected="${nivelSeleccionado == 'AVANZADO'}">Avanzado</option>
                                <option value="EXPERTO" th:selected="${nivelSeleccionado == 'EXPERTO'}">Experto</option>
                            </select><p th:replace="~{pm/elementos :: error(${erroresFiltros}, 'nivel')}"></p></div>
                            <div class="form-group"><label for="vacantes">Vacantes</label>
                                <input id="vacantes" type="number" name="vacantes" th:value="${vacantes ?: '1'}">
                                <p th:replace="~{pm/elementos :: error(${erroresFiltros}, 'vacantes')}"></p></div>
                        </div>
                        <div class="pm-actions"><button class="btn btn-primary" type="submit">Guardar habilidad</button></div>
                    </form>
                </section>
            </div>
        </div>
    </main>
</div>
</body>
</html>
