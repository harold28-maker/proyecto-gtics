<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proyectos | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content">
    <div class="alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="grid-4"><div class="metric"><div class="metric-icon">▣</div><div class="label">Total proyectos</div><div class="value" th:text="${#lists.size(proyectos)}"></div><div class="hint">En tu portafolio</div></div><div class="metric green"><div class="metric-icon">✓</div><div class="label">Activos</div><div class="value" th:text="${activos}"></div><div class="hint">En ejecución</div></div><div class="metric blue"><div class="metric-icon">◷</div><div class="label">Planificación</div><div class="value" th:text="${planning}"></div><div class="hint">Preparándose</div></div><div class="metric orange"><div class="metric-icon">◆</div><div class="label">Completados</div><div class="value" th:text="${completados}"></div><div class="hint">Histórico</div></div></div>
    <div class="page-actions section"><div><p class="eyebrow">Portafolio</p><p class="muted mb-0">Gestiona ciclo de vida, progreso y habilidades requeridas de cada proyecto.</p></div><a class="btn btn-primary" th:href="@{/pm/proyectos/nuevo}">＋ Nuevo proyecto</a></div>
    <section class="card"><form class="filters" method="get"><input class="search" name="q" th:value="${q}" placeholder="Buscar proyecto"><button class="btn btn-light">Buscar</button><a class="btn btn-light" th:href="@{/pm/proyectos}">Limpiar</a></form><div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Estado</th><th>Prioridad</th><th>Vacantes</th><th>Periodo</th><th>Progreso</th><th>Acciones</th></tr></thead><tbody>
        <tr th:each="p : ${proyectos}"><td><strong th:text="${p.nombre}"></strong><br><small class="muted" th:text="${p.descripcion}"></small></td><td><span class="badge" th:classappend="${p.estado.name() == 'ACTIVE'} ? ' badge-success' : (${p.estado.name() == 'PLANNING'} ? ' badge-blue' : ' badge-warning')" th:text="${p.estado}"></span></td><td><span class="badge badge-purple" th:text="${p.prioridad}"></span></td><td th:text="${p.vacantes}"></td><td><span th:text="${p.fechaInicio}"></span><br><small class="muted" th:text="${p.fechaFin}"></small></td><td style="min-width:140px"><div class="progress"><span th:style="|width:${p.progreso}%|"></span></div><small class="muted" th:text="|${p.progreso}% completado|"></small></td><td><div class="action-row"><a class="btn btn-light btn-sm" th:href="@{/pm/proyectos/editar/{id}(id=${p.idProyecto})}">Editar</a><a class="btn btn-blue-soft btn-sm" th:href="@{/pm/proyectos/{id}/habilidades(id=${p.idProyecto})}">Skills</a><form th:if="${p.estado.name() != 'CANCELLED' and p.estado.name() != 'COMPLETED'}" th:action="@{/pm/proyectos/{id}/cancelar(id=${p.idProyecto})}" method="post"><button class="btn btn-danger-soft btn-sm">Cancelar</button></form></div></td></tr>
        </tbody></table></div></section>
</div></main></div></body></html>
