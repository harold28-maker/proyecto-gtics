<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proyectos | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head>
<body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]">
    <div class="alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="grid-4 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><div class="metric-icon">▣</div><div class="label">Total proyectos</div><div class="value" th:text="${#lists.size(proyectos)}"></div><div class="hint">En tu portafolio</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm green"><div class="metric-icon">✓</div><div class="label">Activos</div><div class="value" th:text="${activos}"></div><div class="hint">En ejecución</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm blue"><div class="metric-icon">◷</div><div class="label">Planificación</div><div class="value" th:text="${planning}"></div><div class="hint">Preparándose</div></div><div class="metric relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm orange"><div class="metric-icon">◆</div><div class="label">Completados</div><div class="value" th:text="${completados}"></div><div class="hint">Histórico</div></div></div>
    <div class="page-actions section"><div><p class="eyebrow">Portafolio</p><p class="muted mb-0">Gestiona ciclo de vida, progreso y habilidades requeridas de cada proyecto.</p></div><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-primary bg-brand-600 text-white hover:bg-brand-700 focus:ring-brand-100" th:href="@{/pm/proyectos/nuevo}">＋ Nuevo proyecto</a></div>
    <section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><form class="filters flex flex-col gap-3 rounded-xl bg-gray-50 p-3 sm:flex-row sm:flex-wrap sm:items-center" method="get"><input class="search w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" name="q" th:value="${q}" placeholder="Buscar proyecto"><button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100">Buscar</button><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100" th:href="@{/pm/proyectos}">Limpiar</a></form><div class="table-wrap overflow-x-auto rounded-xl border border-gray-200"><table class="w-full min-w-[720px] border-collapse text-left text-sm"><thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wide text-gray-500"><tr><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Proyecto</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Estado</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Prioridad</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Vacantes</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Periodo</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Progreso</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Acciones</th></tr></thead><tbody class="divide-y divide-gray-100 bg-white">
        <tr th:each="p : ${proyectos}"><td class="px-4 py-3 align-middle text-sm text-gray-700"><strong th:text="${p.nombre}"></strong><br><small class="muted" th:text="${p.descripcion}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold" th:classappend="${p.estado.name() == 'ACTIVE'} ? ' badge-success' : (${p.estado.name() == 'PLANNING'} ? ' badge-blue' : ' badge-warning')" th:text="${p.estado}"></span></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-purple bg-brand-50 text-brand-700" th:text="${p.prioridad}"></span></td><td class="px-4 py-3 align-middle text-sm text-gray-700" th:text="${p.vacantes}"></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span th:text="${p.fechaInicio}"></span><br><small class="muted" th:text="${p.fechaFin}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700" style="min-width:140px"><div class="progress"><span th:style="|width:${p.progreso}%|"></span></div><small class="muted" th:text="|${p.progreso}% completado|"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="action-row"><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light btn-sm border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100" th:href="@{/pm/proyectos/editar/{id}(id=${p.idProyecto})}">Editar</a><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-blue-soft btn-sm border border-blue-light-200 bg-blue-light-50 text-blue-light-700 hover:bg-blue-light-100 focus:ring-blue-light-100" th:href="@{/pm/proyectos/{id}/habilidades(id=${p.idProyecto})}">Skills</a><form th:if="${p.estado.name() != 'CANCELLED' and p.estado.name() != 'COMPLETED'}" th:action="@{/pm/proyectos/{id}/cancelar(id=${p.idProyecto})}" method="post"><button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-danger-soft btn-sm border border-error-200 bg-error-50 text-error-700 hover:bg-error-100 focus:ring-error-100">Cancelar</button></form></div></td></tr>
        </tbody></table></div></section>
</div></main></div></body></html>
