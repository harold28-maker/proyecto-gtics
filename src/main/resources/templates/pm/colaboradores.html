<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colaboradores | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><section class="page-intro flex flex-col gap-4 border-b border-gray-100 pb-5 md:flex-row md:items-end md:justify-between"><div><h2>Equipo disponible</h2><p>Consulta perfiles profesionales, seniority y disponibilidad base antes de generar una asignación.</p></div><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-primary bg-brand-600 text-white hover:bg-brand-700 focus:ring-brand-100" th:href="@{/pm/asignaciones/nueva}">＋ Nueva asignación</a></section><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm"><form class="filters flex flex-col gap-3 rounded-xl bg-gray-50 p-3 sm:flex-row sm:flex-wrap sm:items-center" method="get"><input class="search w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" name="q" th:value="${q}" placeholder="Buscar por nombre, cargo o habilidad"><select class="compact w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100"><option>Todos los niveles</option><option>JUNIOR</option><option>SEMI_SENIOR</option><option>SENIOR</option><option>LEAD</option></select><button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100">Buscar</button></form><div class="table-wrap overflow-x-auto rounded-xl border border-gray-200"><table class="w-full min-w-[720px] border-collapse text-left text-sm"><thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wide text-gray-500"><tr><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Colaborador</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Cargo / Área</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Seniority</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Disponibilidad base</th><th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Estado</th></tr></thead><tbody class="divide-y divide-gray-100 bg-white"><tr th:each="c : ${colaboradores}"><td class="px-4 py-3 align-middle text-sm text-gray-700"><div class="table-user"><span class="mini-avatar" th:text="${#strings.substring(c.usuario.nombres,0,1)}"></span><div><strong th:text="${c.usuario.nombreCompleto}"></strong><small th:text="${c.usuario.correo}"></small></div></div></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><strong th:text="${c.cargo}"></strong><br><small class="muted" th:text="${c.area}"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-purple bg-brand-50 text-brand-700" th:text="${c.seniority}"></span></td><td class="px-4 py-3 align-middle text-sm text-gray-700" style="min-width:150px"><div class="progress green"><span th:style="|width:${c.disponibilidadBase}%|"></span></div><small th:text="|${c.disponibilidadBase}% declarado|"></small></td><td class="px-4 py-3 align-middle text-sm text-gray-700"><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-success bg-success-50 text-success-700" th:text="${c.usuario.estado}"></span></td></tr></tbody></table></div></section></div></main></div></body></html>
