<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Colaboradores | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/project-manager.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content pm-ui">
            <th:block th:replace="~{pm/elementos :: avisos}"></th:block>
            <section class="page-intro">
                <div><h2>Directorio de colaboradores</h2><p>Revisa las habilidades y la disponibilidad antes de preparar una asignación.</p></div>
                <a class="btn btn-primary" th:unless="${permisosBloqueados.contains('asignaciones')}" th:href="@{/pm/asignaciones/nueva}">Nueva asignación</a>
            </section>
            <section class="card">
                <form class="pm-filter" method="get" th:action="@{/pm/colaboradores}" novalidate>
                    <label class="pm-search">Buscar colaborador<input type="search" name="q" th:value="${q}" placeholder="Nombre, cargo o habilidad">
                        <span th:replace="~{pm/elementos :: error(${erroresFiltros}, 'q')}"></span></label>
                    <label>Nivel profesional<select name="nivel"><option value="">Todos los niveles</option>
                        <option th:each="n : ${niveles}" th:value="${n.name()}" th:selected="${n == nivelSeleccionado}" th:text="${n.etiqueta}"></option></select>
                        <span th:replace="~{pm/elementos :: error(${erroresFiltros}, 'nivel')}"></span></label>
                    <label th:if="${verCapacidad}">Disponibilidad hoy<select name="disponibilidad"><option value="">Todas</option>
                        <option th:each="c : ${clasificaciones}" th:value="${c.name()}" th:selected="${c == disponibilidadSeleccionada}" th:text="${c.etiqueta}"></option></select>
                        <span th:replace="~{pm/elementos :: error(${erroresFiltros}, 'disponibilidad')}"></span></label>
                    <button class="btn btn-primary" type="submit">Buscar</button><a class="btn btn-light" th:href="@{/pm/colaboradores}">Limpiar</a>
                </form>
                <p th:replace="~{pm/elementos :: error(${erroresFiltros}, 'page')}"></p>
                <p th:unless="${verCapacidad}"><span th:replace="~{pm/elementos :: error(${erroresFiltros}, 'disponibilidad')}"></span></p>
                <p class="empty" th:if="${colaboradores.isEmpty() and erroresFiltros.isEmpty()}">No se encontraron colaboradores.</p>
                <div class="table-wrap" th:unless="${colaboradores.isEmpty()}">
                    <table>
                        <thead><tr><th scope="col">Colaborador</th><th scope="col">Nivel profesional</th><th scope="col">Habilidades registradas</th>
                            <th scope="col" th:if="${verCapacidad}">Disponible hoy</th><th scope="col">Perfil</th></tr></thead>
                        <tbody>
                        <tr th:each="c : ${colaboradores}">
                            <td><div class="pm-persona">
                                <span th:replace="~{fragments/perfil :: avatar(${c.usuario}, @{/pm/colaboradores/fotos/{id}(id=${c.idColaborador})}, 'avatar')}"></span>
                                <div><strong th:text="${c.usuario.nombreCompleto}"></strong><small class="pm-meta" th:text="${c.cargo ?: 'Sin cargo registrado'}"></small>
                                    <small class="pm-meta" th:if="${c.usuario.estado.name() != 'ACTIVO'}" th:text="${c.usuario.estado}"></small></div></div></td>
                            <td><span class="badge badge-purple" th:text="${c.seniority == null ? 'Sin nivel' : c.seniority.etiqueta}"></span></td>
                            <td><div class="pm-chips" th:with="lista=${habilidadesPorPersona[c.idColaborador]}">
                                <span class="badge badge-blue" th:each="h, orden : ${lista}" th:if="${orden.index < 4}" th:text="${h.nombre}"></span>
                                <span class="pm-meta" th:if="${lista.isEmpty()}">Sin habilidades registradas</span>
                                <span class="pm-meta" th:if="${lista.size() > 4}" th:text="|+${lista.size() - 4}|"></span>
                            </div></td>
                            <td th:if="${verCapacidad}"><div th:replace="~{pm/elementos :: barra(${capacidades[c.idColaborador].disponibilidad}, 'green')}"></div></td>
                            <td><a class="btn btn-light btn-sm" th:href="@{/pm/colaboradores/{id}(id=${c.idColaborador})}">Ver perfil</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pm-pie" th:if="${total > 0}">
                    <span class="pm-meta" th:text="|Mostrando ${desde}–${hasta} de ${total} perfiles|"></span>
                    <nav class="pm-actions" th:if="${totalPaginas > 1}" aria-label="Páginas de colaboradores"
                         th:with="nivelCodigo=${nivelSeleccionado?.name()}, disponibilidadCodigo=${disponibilidadSeleccionada?.name()}">
                        <a class="btn btn-light btn-sm" th:if="${paginaActual > 1}"
                           th:href="@{/pm/colaboradores(q=${q},nivel=${nivelCodigo},disponibilidad=${disponibilidadCodigo},page=${paginaActual - 1})}">Anterior</a>
                        <span class="badge badge-purple" th:text="|Página ${paginaActual} de ${totalPaginas}|"></span>
                        <a class="btn btn-light btn-sm" th:if="${paginaActual < totalPaginas}"
                           th:href="@{/pm/colaboradores(q=${q},nivel=${nivelCodigo},disponibilidad=${disponibilidadCodigo},page=${paginaActual + 1})}">Siguiente</a>
                    </nav>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
