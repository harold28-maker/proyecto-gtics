<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Proyecto | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/project-manager.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
        <div class="content pm-ui">
            <th:block th:replace="~{pm/elementos :: avisos}"></th:block>
            <section class="page-intro"><div><h2 th:text="${titulo}"></h2><p>Define el período, la prioridad y las necesidades de tu proyecto.</p></div>
                <a class="btn btn-light" th:href="@{/pm/proyectos}">Volver a Proyectos</a>
            </section>
            <section class="card form-card">
                <form class="pm-form" th:action="@{/pm/proyectos/guardar}" th:object="${proyecto}" method="post" novalidate>
                    <input type="hidden" th:field="*{idProyecto}">
                    <div class="form-grid">
                        <div class="form-group full"><label for="nombre">Nombre del proyecto</label>
                            <input type="text" th:field="*{nombre}" th:errorclass="is-invalid">
                            <p class="field-error" role="alert" th:errors="*{nombre}"></p></div>
                        <div class="form-group full"><label for="descripcion">Descripción</label>
                            <textarea rows="3" th:field="*{descripcion}" th:errorclass="is-invalid"></textarea>
                            <p class="field-error" role="alert" th:errors="*{descripcion}"></p></div>
                        <div class="form-group full"><label for="tecnologias">Tecnologías utilizadas</label>
                            <input type="text" th:field="*{tecnologias}" placeholder="Ej. Java, Spring Boot, MySQL" th:errorclass="is-invalid">
                            <p class="field-error" role="alert" th:errors="*{tecnologias}"></p></div>
                        <div class="form-group"><label for="fechaInicio">Fecha de inicio</label>
                            <input type="date" th:field="*{fechaInicio}" th:errorclass="is-invalid">
                            <p class="field-error" role="alert" th:errors="*{fechaInicio}"></p></div>
                        <div class="form-group"><label for="fechaFin">Fecha de fin</label>
                            <input type="date" th:field="*{fechaFin}" th:errorclass="is-invalid">
                            <p class="field-error" role="alert" th:errors="*{fechaFin}"></p>
                            <p class="field-error" role="alert" th:errors="*{periodoValido}"></p></div>
                        <div class="form-group"><label for="vacantes">Personas requeridas</label>
                            <input type="number" th:field="*{vacantes}" th:errorclass="is-invalid">
                            <p class="field-error" role="alert" th:errors="*{vacantes}"></p></div>
                        <div class="form-group"><label for="prioridad">Prioridad</label>
                            <select th:field="*{prioridad}" th:errorclass="is-invalid"><option th:each="p : ${prioridades}" th:value="${p}" th:text="${p.etiqueta}"></option></select>
                            <p class="field-error" role="alert" th:errors="*{prioridad}"></p></div>
                        <div class="form-group"><label for="estado">Estado</label>
                            <select th:field="*{estado}" th:errorclass="is-invalid"><option th:each="e : ${estados}" th:value="${e}" th:text="${e.etiqueta}"></option></select>
                            <p class="field-error" role="alert" th:errors="*{estado}"></p></div>
                        <div class="form-group"><label for="progreso">Avance (%)</label>
                            <input type="number" th:field="*{progreso}" th:errorclass="is-invalid">
                            <p class="field-error" role="alert" th:errors="*{progreso}"></p></div>
                    </div>
                    <div class="pm-actions">
                        <a class="btn btn-light" th:if="${proyecto.idProyecto != null}" th:href="@{/pm/proyectos/{id}/habilidades(id=${proyecto.idProyecto})}">Habilidades requeridas</a>
                        <a class="btn btn-light" th:href="@{/pm/proyectos}">Cancelar</a>
                        <button class="btn btn-primary" type="submit">Guardar proyecto</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>
