<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proyecto | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/tailwind.css}"></head><body><div class="app-shell min-h-screen bg-gray-50 font-outfit text-gray-900"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main min-w-0"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content mx-auto w-full max-w-[1600px]"><section class="page-intro flex flex-col gap-4 border-b border-gray-100 pb-5 md:flex-row md:items-end md:justify-between"><div><h2>Información del proyecto</h2><p>Completa los datos principales, periodo, vacantes, prioridad, estado y progreso.</p></div><span class="badge inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold badge-purple bg-brand-50 text-brand-700">Gestión de proyectos</span></section><div class="grid-3 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3"><section class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm" style="grid-column:span 2"><form th:action="@{/pm/proyectos/guardar}" th:object="${proyecto}" method="post"><input type="hidden" th:field="*{idProyecto}"><div class="form-grid grid grid-cols-1 gap-5 md:grid-cols-2"><div class="form-group space-y-2 full"><label>Nombre del proyecto</label><input class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" th:field="*{nombre}" required placeholder="Ej. Plataforma Web Corporativa"></div><div class="form-group space-y-2 full"><label>Descripción</label><textarea class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" rows="5" th:field="*{descripcion}" placeholder="Describe el objetivo y alcance principal del proyecto."></textarea></div><div class="form-group space-y-2"><label>Fecha inicio</label><input class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" type="date" th:field="*{fechaInicio}"></div><div class="form-group space-y-2"><label>Fecha fin</label><input class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" type="date" th:field="*{fechaFin}"></div><div class="form-group space-y-2"><label>Vacantes</label><input class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" type="number" min="0" th:field="*{vacantes}"></div><div class="form-group space-y-2"><label>Prioridad</label><select class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" th:field="*{prioridad}"><option value="BAJA">BAJA</option><option value="MEDIA">MEDIA</option><option value="ALTA">ALTA</option></select></div><div class="form-group space-y-2"><label>Estado</label><select class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" th:field="*{estado}"><option value="PLANNING">PLANNING</option><option value="ACTIVE">ACTIVE</option><option value="ON_HOLD">ON_HOLD</option><option value="COMPLETED">COMPLETED</option><option value="CANCELLED">CANCELLED</option></select></div><div class="form-group space-y-2"><label>Progreso (%)</label><input class="w-full rounded-lg border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-xs transition placeholder:text-gray-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-100" type="number" min="0" max="100" th:field="*{progreso}"></div></div><div class="form-actions flex flex-col-reverse gap-3 border-t border-gray-100 pt-5 sm:flex-row sm:justify-end"><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-light border border-gray-200 bg-white text-gray-700 hover:border-brand-200 hover:bg-brand-50 focus:ring-brand-100" th:href="@{/pm/proyectos}">Cancelar</a><button class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-primary bg-brand-600 text-white hover:bg-brand-700 focus:ring-brand-100">Guardar proyecto</button></div></form></section><aside class="card rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm hero-card"><p class="eyebrow">Resumen</p><h3 th:text="${proyecto.nombre ?: 'Nuevo proyecto'}"></h3><p class="muted" th:text="${proyecto.descripcion ?: 'La información ingresada se almacenará en la tabla proyectos.'}"></p><div class="soft-panel rounded-xl border border-gray-100 bg-gray-50 p-4"><small class="muted">Estado inicial</small><strong style="display:block;margin-top:5px" th:text="${proyecto.estado ?: 'PLANNING'}"></strong></div><div class="soft-panel rounded-xl border border-gray-100 bg-gray-50 p-4" style="margin-top:10px"><small class="muted">Progreso</small><div class="progress" style="margin-top:7px"><span th:style="|width:${proyecto.progreso ?: 0}%|"></span></div><small th:text="|${proyecto.progreso ?: 0}%|"></small></div><a class="btn inline-flex items-center justify-center rounded-lg font-semibold transition duration-150 focus:outline-none focus:ring-4 btn-blue-soft border border-blue-light-200 bg-blue-light-50 text-blue-light-700 hover:bg-blue-light-100 focus:ring-blue-light-100" style="width:100%;margin-top:12px" th:if="${proyecto.idProyecto != null}" th:href="@{/pm/proyectos/{id}/habilidades(id=${proyecto.idProyecto})}">Gestionar habilidades requeridas</a></aside></div></div></main></div></body></html>
