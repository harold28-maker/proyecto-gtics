<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proyecto | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="page-intro"><div><h2>Información del proyecto</h2><p>Completa los datos principales, periodo, vacantes, prioridad, estado y progreso.</p></div><span class="badge badge-purple">Gestión de proyectos</span></section><div class="grid-3"><section class="card" style="grid-column:span 2"><form th:action="@{/pm/proyectos/guardar}" th:object="${proyecto}" method="post"><input type="hidden" th:field="*{idProyecto}"><div class="form-grid"><div class="form-group full"><label>Nombre del proyecto</label><input th:field="*{nombre}" required placeholder="Ej. Plataforma Web Corporativa"></div><div class="form-group full"><label>Descripción</label><textarea rows="5" th:field="*{descripcion}" placeholder="Describe el objetivo y alcance principal del proyecto."></textarea></div><div class="form-group"><label>Fecha inicio</label><input type="date" th:field="*{fechaInicio}"></div><div class="form-group"><label>Fecha fin</label><input type="date" th:field="*{fechaFin}"></div><div class="form-group"><label>Vacantes</label><input type="number" min="0" th:field="*{vacantes}"></div><div class="form-group"><label>Prioridad</label><select th:field="*{prioridad}"><option value="BAJA">BAJA</option><option value="MEDIA">MEDIA</option><option value="ALTA">ALTA</option></select></div><div class="form-group"><label>Estado</label><select th:field="*{estado}"><option value="PLANNING">PLANNING</option><option value="ACTIVE">ACTIVE</option><option value="ON_HOLD">ON_HOLD</option><option value="COMPLETED">COMPLETED</option><option value="CANCELLED">CANCELLED</option></select></div><div class="form-group"><label>Progreso (%)</label><input type="number" min="0" max="100" th:field="*{progreso}"></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/pm/proyectos}">Cancelar</a><button class="btn btn-primary">Guardar proyecto</button></div></form></section><aside class="card hero-card"><p class="eyebrow">Resumen</p><h3 th:text="${proyecto.nombre ?: 'Nuevo proyecto'}"></h3><p class="muted" th:text="${proyecto.descripcion ?: 'La información ingresada se almacenará en la tabla proyectos.'}"></p><div class="soft-panel"><small class="muted">Estado inicial</small><strong style="display:block;margin-top:5px" th:text="${proyecto.estado ?: 'PLANNING'}"></strong></div><div class="soft-panel" style="margin-top:10px"><small class="muted">Progreso</small><div class="progress" style="margin-top:7px"><span th:style="|width:${proyecto.progreso ?: 0}%|"></span></div><small th:text="|${proyecto.progreso ?: 0}%|"></small></div><a class="btn btn-blue-soft" style="width:100%;margin-top:12px" th:if="${proyecto.idProyecto != null}" th:href="@{/pm/proyectos/{id}/habilidades(id=${proyecto.idProyecto})}">Gestionar habilidades requeridas</a></aside></div></div></main></div></body></html>
