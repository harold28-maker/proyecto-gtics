<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="marca" class="login-side" aria-labelledby="login-intro">
    <div class="login-side-brand">
        <th:block th:replace="~{fragments/layout :: brandLogo(352)}"></th:block>
    </div>

    <div class="login-side-content">
        <h2 id="login-intro">Talento, proyectos y conocimiento.</h2>
        <p>Organiza equipos y asignaciones en un solo lugar.</p>

        <dl class="login-topic-list">
            <div>
                <dt>Talento</dt>
                <dd>Habilidades y disponibilidad</dd>
            </div>
            <div>
                <dt>Proyectos</dt>
                <dd>Equipos y asignaciones</dd>
            </div>
            <div>
                <dt>Conocimiento</dt>
                <dd>Foros y experiencia</dd>
            </div>
        </dl>
    </div>

    <small class="login-side-footer">Plataforma interna</small>
</section>

<a th:fragment="volverInicio" class="login-back-link" th:href="@{/}">
    <span aria-hidden="true">←</span>
    Volver al inicio
</a>
</body>
</html>
