spring.application.name=skillbridge-ai

# ============================================================
# CONEXION A MYSQL EN AWS RDS
# La contraseña debe configurarse con SPRING_DATASOURCE_PASSWORD.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://database-1.cvrl28ymltsm.us-east-1.rds.amazonaws.com:3306/skillbridge_ai?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# La base ya se crea con el script SQL entregado.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.port=${PORT:8080}

# ============================================================
# CARGA DE CREDENCIALES DEL COLABORADOR
# PDF / PNG / JPG / JPEG. La carpeta puede externalizarse en cloud
# usando la variable de entorno UPLOAD_DIR.
# ============================================================
skillbridge.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ============================================================
# CHATBOT GEMINI - SPRING AI
# GEMINI_API_KEY se configura solo como secreto de entorno.
# ============================================================
skillbridge.chatbot.provider=${SKILLBRIDGE_CHATBOT_PROVIDER:gemini}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=${GEMINI_TEMPERATURE:0.2}
spring.ai.google.genai.chat.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:700}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# El formulario de edición envía hasta 13 partes con la foto y su recorte.
server.tomcat.max-part-count=20

# Recuperación de contraseña y correo de cuentas
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/actualizacion_recuperacion_contrasena.sql,classpath:database/actualizacion_permisos_roles.sql,classpath:database/actualizacion_categorias_habilidades.sql,classpath:database/actualizacion_chatbot_gemini.sql
skillbridge.public-url=${SKILLBRIDGE_PUBLIC_URL:http://localhost:${server.port}}
skillbridge.correo.remitente=${SKILLBRIDGE_MAIL_FROM:${spring.mail.username:}}
spring.mail.port=587
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
