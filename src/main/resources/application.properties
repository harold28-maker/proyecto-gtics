spring.application.name=skillbridge-ai

# ============================================================
# MYSQL LOCAL / AMAZON RDS
# En AWS define las tres variables SPRING_DATASOURCE_* desde
# ECS + Secrets Manager. No almacenes credenciales en este archivo.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skillbridge_ai?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# La base ya se crea con el script SQL entregado.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.port=${PORT:8080}

# ============================================================
# CARGA DE CREDENCIALES DEL COLABORADOR
# PDF / PNG / JPG / JPEG. La carpeta puede externalizarse en cloud
# usando la variable de entorno UPLOAD_DIR.
# ============================================================
skillbridge.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ============================================================
# CHATBOT GEMINI - SPRING AI
# GEMINI_API_KEY se configura solo como secreto de entorno.
# GOOGLE_API_KEY se mantiene como alias compatible fuera de Docker.
# ============================================================
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=${GEMINI_TEMPERATURE:0.2}
spring.ai.google.genai.chat.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:700}

# Health check para Docker, ALB y ECS.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
