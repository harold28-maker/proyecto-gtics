spring.application.name=skillbridge-ai

# ============================================================
# CONEXION LOCAL A MYSQL
# Cambia username y password por los de tu MySQL Workbench.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/skillbridge_ai?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# La base ya se crea con el script SQL entregado.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.port=8080
