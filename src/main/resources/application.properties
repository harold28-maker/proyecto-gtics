spring.application.name=skillbridge-ai

# ============================================================
# CONEXION LOCAL A MYSQL
# Cambia username y password por los de tu MySQL Workbench.
# ============================================================
#spring.datasource.url=jdbc:mysql://database-1.cvrl28ymltsm.us-east-1.rds.amazonaws.com:3306/skillbridge_ai?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true
#spring.datasource.username=admin
# Credencial cloud antigua retirada por seguridad (no cambiar la conexion activa).

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skillbridge_ai?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# La base ya se crea con el script SQL entregado.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.port=${PORT:8080}

# ============================================================
# CARGA DE CREDENCIALES DEL COLABORADOR
# PDF / PNG / JPG / JPEG. La carpeta puede externalizarse en cloud
# usando la variable de entorno UPLOAD_DIR.
# ============================================================
skillbridge.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# El formulario de edición envía hasta 13 partes con la foto y su recorte.
server.tomcat.max-part-count=20

# Recuperación de contraseña y correo de cuentas
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/actualizacion_recuperacion_contrasena.sql,classpath:database/actualizacion_permisos_roles.sql,classpath:database/actualizacion_categorias_habilidades.sql
skillbridge.public-url=${SKILLBRIDGE_PUBLIC_URL:http://localhost:${server.port}}
skillbridge.correo.remitente=${SKILLBRIDGE_MAIL_FROM:${spring.mail.username:}}
spring.mail.port=587
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
